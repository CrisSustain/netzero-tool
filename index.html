<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Net Zero Management Tool</title>
<style>
/* 2026-07-26: Design-Token komplett auf das "Future Technical"-System des TEW-Umwelt-Dashboards
   umgestellt (Quelle: TEW_Umwelt_Dashboard_V12.html) - gestufte Dunkelflaechen, Akzent TEW-Blau
   #1269B0, Statusfarben und Radien identisch. Nur Optik, keine fachliche AEnderung. */
:root{
  --bg:#0a0d0f; --bg-alt:#0c1012; --surface:#12171a; --surface-alt:#171d20;
  --border:rgba(233,240,242,.12); --text:#eef2f3; --text-muted:#9babb1;
  --accent:#1269B0; --accent-strong:#0F5996;
  --accent-dim:rgba(18,105,176,.16); --accent-border:rgba(18,105,176,.42); --ink-on-accent:#04121a;
  --success:#24b06a; --warning:#e0a530; --danger:#e35b52; --danger-text:#f6b3ad; --neutral:#8a9aa4;
  --radius:8px; --radius-sm:5px; --shadow:0 1px 2px rgba(0,0,0,.4);
  --font:'Segoe UI',system-ui,-apple-system,sans-serif;
  --font-mono:ui-monospace,'Cascadia Code',Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.5}
header{position:sticky;top:0;z-index:20;background:var(--bg-alt);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;box-shadow:var(--shadow)}
header .brand{font-weight:700;font-size:1.05rem;margin-right:auto;white-space:nowrap}
header .brand small{display:block;font-weight:400;color:var(--text-muted);font-size:.72rem}
header .brand small.credit{font-size:.64rem;opacity:.75;font-style:italic}
.btn{background:var(--surface-alt);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 11px;font-size:.82rem;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.active{background:var(--accent);border-color:var(--accent);color:#04121a;font-weight:600}
.btn-group{display:flex;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:2px}
.btn-group .btn{border:none;background:transparent}
.btn-group .btn.active{background:var(--accent);color:#04121a}
nav.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:56px;z-index:19}
nav.tabs .tab-btn{background:var(--surface);border:1px solid var(--border);color:var(--text-muted);border-radius:999px;padding:6px 13px;font-size:.78rem;cursor:pointer}
nav.tabs .tab-btn.active{background:var(--accent);color:#04121a;border-color:var(--accent);font-weight:600}
main{padding:20px;max-width:1200px;margin:0 auto}
h2{margin-top:0;font-size:1.3rem;border-bottom:1px solid var(--border);padding-bottom:8px}
h3{font-size:1.02rem;color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
label{display:block;font-size:.78rem;color:var(--text-muted);margin-bottom:4px}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;background:var(--bg-alt);border:1px solid var(--border);color:var(--text);
  border-radius:var(--radius-sm);padding:8px 9px;font-size:.88rem;font-family:var(--font)
}
input[type=range]{width:100%;accent-color:var(--accent)}
/* V3 (Anwenderfund 27.07.): Die Auf/Ab-Pfeile der Zahlenfelder wurden vom Browser hell
   gezeichnet und stachen im dunklen Design als weisser Block hervor. color-scheme sagt dem
   Browser, dass er die nativen Bedienelemente dunkel rendern soll — wirkt ohne Nachbau. */
input[type=number]{color-scheme:dark}
:root[data-theme="light"] input[type=number]{color-scheme:light}
textarea{min-height:70px;resize:vertical}
.field{margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:.83rem}
th,td{border:1px solid var(--border);padding:6px 8px;text-align:right}
th:first-child,td:first-child{text-align:left}
thead th{background:var(--surface-alt);color:var(--text-muted);font-weight:600}
tbody tr:hover{background:var(--surface-alt)}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{background:var(--surface-alt);border:1px solid var(--border);border-radius:var(--radius);padding:14px;
  border-left:4px solid var(--accent);transition:transform .15s ease,box-shadow .15s ease}
.kpi:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.4)}
.kpi .val{font-size:1.5rem;font-weight:700}
.kpi .lbl{font-size:.75rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em}
/* Ampel-Farbkennung für bewertbare Kennzahlen */
.kpi.gut{border-left-color:var(--success);border-color:rgba(36,176,106,.35);background:linear-gradient(135deg,rgba(36,176,106,.10),var(--surface-alt) 55%)}
.kpi.gut .val{color:var(--success)}
.kpi.warnung{border-left-color:var(--warning);border-color:rgba(224,165,48,.35);background:linear-gradient(135deg,rgba(224,165,48,.10),var(--surface-alt) 55%)}
.kpi.warnung .val{color:var(--warning)}
.kpi.kritisch{border-left-color:var(--danger);border-color:rgba(227,91,82,.35);background:linear-gradient(135deg,rgba(227,91,82,.10),var(--surface-alt) 55%)}
.kpi.kritisch .val{color:var(--danger)}
.flag{display:inline-block;border-radius:999px;padding:3px 12px;font-size:.78rem;font-weight:700}
.flag.gut{background:rgba(36,176,106,.18);color:var(--success)}
.flag.warnung{background:rgba(224,165,48,.18);color:var(--warning)}
.flag.kritisch{background:rgba(227,91,82,.18);color:var(--danger)}
.coverage-card{border-radius:var(--radius);padding:14px;background:var(--surface-alt);border-top:4px solid var(--neutral)}
.coverage-card.gut{border-top-color:var(--success)}
.coverage-card.warnung{border-top-color:var(--warning)}
.coverage-card.kritisch{border-top-color:var(--danger)}
.bar-track{background:var(--bg-alt);border-radius:999px;height:10px;overflow:hidden;border:1px solid var(--border)}
.bar-fill{height:100%;background:var(--accent)}
.hint{font-size:.78rem;color:var(--text-muted);margin-top:4px}
.assumption{background:rgba(224,165,48,.1);border:1px dashed var(--warning);border-radius:var(--radius-sm);padding:10px 12px;font-size:.82rem;margin:10px 0}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:720px){.two-col{grid-template-columns:1fr}}
.row-actions{display:flex;gap:6px;margin-top:8px}
.small-btn{padding:4px 9px;font-size:.75rem}
dl{margin:0}
dt{font-weight:700;color:var(--accent);margin-top:10px}
dd{margin-left:0;color:var(--text-muted)}
.hidden{display:none!important}
.slider-row{display:flex;align-items:center;gap:10px}
.slider-row .slider-val{width:50px;text-align:right;font-weight:700;color:var(--accent)}
.empty-hint{color:var(--text-muted);text-align:center;padding:14px;font-style:italic}
.impact{border-radius:var(--radius-sm);padding:8px 10px;margin-top:6px;border-left:3px solid var(--neutral)}
.impact.gut{border-left-color:var(--success);color:var(--success)}
.impact.warnung{border-left-color:var(--warning);color:var(--warning)}
.impact.kritisch{border-left-color:var(--danger);color:var(--danger)}
.kpi-bar{position:fixed;bottom:0;left:0;right:0;z-index:25;background:var(--bg-alt);border-top:1px solid var(--border);
  padding:7px 16px;display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;font-size:.78rem;box-shadow:0 -4px 14px rgba(0,0,0,.35)}
.kpi-bar .kb-lbl{color:var(--text-muted);margin-right:5px}
.kpi-bar .kb-val{font-weight:700}
.kpi-bar .kb-warn{color:var(--warning);font-weight:700}
.save-badge{font-size:.72rem;color:var(--text-muted);white-space:nowrap;min-width:86px;text-align:center}
.save-badge.dirty{color:var(--warning)}
.save-badge.error{color:var(--danger-text);font-weight:700;cursor:help}
.blocked-card{border-color:rgba(227,91,82,.45);background:linear-gradient(135deg,rgba(227,91,82,.10),var(--surface-alt) 55%)}
.notice{font-size:.8rem;color:var(--text-muted);border-left:3px solid var(--accent);padding:6px 10px;background:var(--bg-alt);border-radius:4px}
.warn-box{background:rgba(224,165,48,.08);border:1px solid var(--warning);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:14px}
.warn-box ul{margin:0;padding-left:18px}
.warn-box li{font-size:.8rem;color:var(--warning);margin:2px 0}
.tab-select-wrap{display:none;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--border)}
.tab-select-wrap select{width:100%}
.info{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:999px;
  background:var(--surface-alt);border:1px solid var(--border);color:var(--text-muted);font-size:.62rem;
  cursor:help;position:relative;vertical-align:middle;margin-left:4px;font-weight:700}
.info .tip{visibility:hidden;opacity:0;position:absolute;bottom:130%;left:50%;transform:translateX(-50%);
  background:var(--bg-alt);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:6px;
  width:260px;font-size:.72rem;line-height:1.4;z-index:70;transition:opacity .15s;box-shadow:var(--shadow);
  text-align:left;white-space:normal;font-weight:400;pointer-events:none}
.info:hover .tip,.info:focus .tip{visibility:visible;opacity:1}
.qbadge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.72rem;font-weight:700;border:1px solid var(--border)}
.qbadge.qa{background:rgba(36,176,106,.18);color:var(--success)}
.qbadge.qb{background:rgba(18,105,176,.18);color:var(--accent)}
.qbadge.qc{background:rgba(224,165,48,.18);color:var(--warning)}
.qbadge.qd{background:rgba(227,91,82,.18);color:var(--danger)}
.notice{background:rgba(18,105,176,.08);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:var(--radius-sm);padding:10px 12px;font-size:.82rem;margin-bottom:16px}
.co2-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.co2-card{background:var(--surface-alt);border:1px solid var(--border);border-radius:var(--radius);padding:14px;transition:transform .15s ease,box-shadow .15s ease}
.co2-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.4)}
/* ersetzt: die Kacheln tragen jetzt SVG-Icons in Akzentfarbe, nicht mehr Emoji-Text */
.co2-lbl{font-size:.78rem;color:var(--text-muted);margin-top:6px}
.co2-val{font-size:1.35rem;font-weight:700;margin-top:4px}
.co2-unit{font-size:.85rem;font-weight:400;color:var(--text-muted)}
.co2-src{font-size:.72rem;color:var(--text-muted);margin-top:8px;line-height:1.35}
.co2-src a{color:var(--accent)}
code{font-size:.78rem;background:var(--bg-alt);padding:1px 5px;border-radius:4px}
.rowcheck{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--border);font-size:.82rem}
footer{padding-bottom:60px}
@media(max-width:700px){
  header{position:static}
  nav.tabs{display:none}
  .tab-select-wrap{display:block;position:sticky;top:0;z-index:19}
  table{display:block;overflow-x:auto}
  .info .tip{width:200px}
  .two-col{grid-template-columns:1fr}
}
footer{padding:16px;text-align:center;color:var(--text-muted);font-size:.75rem}
@media print{
  header,nav.tabs,.no-print{display:none!important}
  /* Dunkle Statusflaechen wuerden auf weissem Papier als schwarze Bloecke drucken (Audit NZ-012).
     Farbsemantik bleibt erhalten, aber als helle Flaeche mit dunklem, kontrastreichem Text. */
  .kpi,.coverage-card,.blocked-card,.notice{background-image:none!important;background:#ffffff!important;border:1px solid #9aa4b2!important;color:#111827!important}
  .kpi .lbl,.coverage-card .lbl,.hint{color:#374151!important}
  .kpi.gut,.coverage-card.gut{background:#e8f7f0!important;border-color:#1c7c54!important}
  .kpi.warnung,.coverage-card.warnung{background:#fdf3e0!important;border-color:#8a5a00!important}
  .kpi.kritisch,.coverage-card.kritisch,.blocked-card{background:#fdecec!important;border-color:#a32323!important}
  .flag{background-image:none!important;color:#111827!important;border:1px solid #6b7280!important}
  .flag.gut{background:#e8f7f0!important} .flag.warnung{background:#fdf3e0!important} .flag.kritisch{background:#fdecec!important}
  .save-badge.error,.blocked-card *{color:#7f1d1d!important}
  body{background:#fff;color:#111}
  .card{border:1px solid #ccc;box-shadow:none;background:#fff}
  .kpi,.coverage-card{background:#f4f4f4}
}

/* ===== V2 (2026-07-26): Komplettes Makeover auf die UX des TEW-Umwelt-Dashboards =====
   Sidebar-Navigation statt Top-Tabs, volle Breite, einklappbare Sticky-Eingabeleiste,
   Split-Layout (Eingaben links / Live-Vorschau rechts), Spotlight, Vollbild je Grafik,
   Hell-/Dunkel-Umschalter. Rechenlogik bleibt unangetastet. */
.body-row{display:flex;align-items:flex-start;min-height:calc(100vh - 56px)}
.sidebar{position:sticky;top:56px;flex:0 0 210px;align-self:flex-start;max-height:calc(100vh - 56px);overflow-y:auto;
  background:var(--bg-alt);border-right:1px solid var(--border);padding:14px 10px;display:flex;flex-direction:column;gap:3px}
.sidebar .tab-btn{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;color:var(--text-muted);
  border-radius:var(--radius-sm);padding:9px 12px;font-size:.86rem;cursor:pointer;line-height:1.3}
.sidebar .tab-btn:hover{background:var(--accent-dim);color:var(--text)}
.sidebar .tab-btn.active{background:var(--accent);border-color:var(--accent);color:var(--ink-on-accent);font-weight:700}
.main-content{flex:1 1 auto;min-width:0}
main{padding:20px 24px;max-width:none;margin:0}
.theme-toggle{background:var(--surface-alt);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);
  width:34px;height:32px;cursor:pointer;font-size:15px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.theme-toggle:hover{border-color:var(--accent);background:var(--accent-dim)}
/* Sticky-Eingabeleiste (Projektrahmen) - einklappbar wie die Filterleiste im Dashboard */
/* V3-Fix (Review 27.07.2026, Anwenderfund "die zwei Menue-Fenster ueberlappen"): Im Markup
   stand zusaetzlich style="position:relative" — vermutlich fuer den absolut positionierten
   Einklapp-Knopf. Das Inline-Style gewinnt gegen jede Regel hier und machte aus dem sticky ein
   relative: bei relative verschiebt top:56px das Element sichtbar nach unten, OHNE dass sein
   Platz im Fluss mitwandert — die Folgekarte "Scope-Parameter" wurde dadurch um 40 px
   ueberlappt. Ein sticky-Element ist selbst ein Positionierungskontext, der Knopf braucht das
   relative also nicht. */
.stickybar-v2{position:sticky;top:56px;z-index:18;background:rgba(255,255,255,.04);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--radius);
  padding:12px 40px 12px 14px;margin-bottom:16px;transition:padding .2s cubic-bezier(.77,0,.175,1)}
.stickybar-v2.is-collapsed{padding-top:6px;padding-bottom:6px;min-height:40px}
/* V3-Fix (Anwenderfund 27.07.: "der Overlap ist noch immer von den zwei Menuefenstern"):
   Die Projektangaben-Karte klebt beim Scrollen. Ausgeklappt ist sie rund 470 px hoch — auf
   einem 720-px-Fenster legt sie sich damit ueber die darunterliegende Karte, statt nur einen
   Kopf stehen zu lassen. Sticky bleibt deshalb nur, wenn das Fenster hoch genug ist; auf
   flacheren Bildschirmen scrollt sie normal mit. Eingeklappt (40 px) klebt sie immer. */
@media (max-height:900px){
  /* relative statt static: der Einklapp-Knopf ist absolut positioniert und braucht einen
     Bezugsrahmen — bei static richtete er sich am naechsten positionierten Vorfahren aus und
     sass ausserhalb der Karte. top:auto hebt den 56-px-Versatz der Basisregel auf, sonst
     wuerde relative die Karte sichtbar verschieben, ohne ihren Platz mitzunehmen. */
  .stickybar-v2:not(.is-collapsed){position:relative;top:auto;backdrop-filter:none;-webkit-backdrop-filter:none}
}
.stickybar-v2.is-collapsed>.grid,.stickybar-v2.is-collapsed>h3{display:none}
.stickybar-toggle{position:absolute;top:6px;right:8px;background:var(--surface-alt);border:1px solid var(--border);color:var(--text);
  border-radius:4px;width:26px;height:24px;cursor:pointer;font-size:12px;line-height:1}
.stickybar-toggle:hover{border-color:var(--accent);background:var(--accent-dim)}
/* Split: Eingaben links, Live-Vorschau rechts (Anwender-Fund: Regler oben, Wirkung unten war unbrauchbar) */
.split-v2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.split-v2 .live-col{position:sticky;top:130px}
@media(max-width:1200px){.split-v2{grid-template-columns:1fr}.split-v2 .live-col{position:static}}
@media(max-width:900px){.body-row{display:block}.sidebar{position:static;flex:none;max-height:none;flex-direction:row;flex-wrap:wrap;
  border-right:none;border-bottom:1px solid var(--border)}.sidebar .tab-btn{width:auto}main{padding:14px}}
/* Spotlight (mausfolgender Lichtschein) */
body.spotlight-on .card{background-image:radial-gradient(240px circle at var(--sx,-999px) var(--sy,-999px),rgba(255,255,255,.055),transparent 70%);background-repeat:no-repeat}
:root[data-theme="light"] body.spotlight-on .card{background-image:radial-gradient(240px circle at var(--sx,-999px) var(--sy,-999px),rgba(18,105,176,.13),transparent 70%)}
@media(prefers-reduced-motion:reduce){body.spotlight-on .card{background-image:none}}
/* Vollbild je Grafik/Karte */
.vollbild-backdrop{position:fixed;inset:0;background:rgba(2,4,8,.72);backdrop-filter:blur(3px);z-index:399}
.card.is-vollbild{position:fixed;inset:32px;z-index:400;overflow:auto;margin:0}
.card.is-vollbild svg{max-height:calc(100vh - 190px)}
/* Anwenderfund: Seit dem Vollbreiten-Umbau wuchsen die Diagramme (width:100%) auf grossen
   Bildschirmen ins Riesige (z. B. Portfolio NPV vs. CO2). Deckel nur fuer Diagramme DIREKT in
   einer Karte - kleine Icon-SVGs (verschachtelt) und der Simulator (.sim-chart) bleiben frei;
   im Vollbild gilt weiterhin die volle Groesse. Hoehe folgt der Breite (height:auto), daher
   keine Verzerrung. */
.card > svg{display:block;max-width:960px;margin-left:auto;margin-right:auto}
.card.is-vollbild > svg{max-width:none}
.vb-btn{float:right;background:var(--surface-alt);border:1px solid var(--border);color:var(--text-muted);border-radius:999px;
  padding:3px 10px;font-size:11px;cursor:pointer;margin-left:8px}
.vb-btn:hover{border-color:var(--accent);color:var(--text);background:var(--accent-dim)}
@media print{.vb-btn,.sidebar,.stickybar-toggle{display:none!important}.body-row{display:block}.card.is-vollbild{position:static;inset:auto}}

/* Hell-Modus: gleiche Variablennamen, invertierte Werte (Muster aus dem Umwelt-Dashboard). */
:root[data-theme="light"]{
  --bg:#f4f6f7; --bg-alt:#eceff1; --surface:#ffffff; --surface-alt:#f7f9fa;
  --border:rgba(10,16,20,.14); --text:#12181b; --text-muted:#5b6870;
  --accent:#1269B0; --accent-strong:#0F5996;
  --accent-dim:rgba(18,105,176,.1); --accent-border:rgba(18,105,176,.42); --ink-on-accent:#ffffff;
  --success:#1c7c54; --warning:#8a5a00; --danger:#a32323; --danger-text:#7f1d1d; --neutral:#5b6870;
  --shadow:0 1px 2px rgba(10,16,20,.1);
}
:root[data-theme="light"] header{background:rgba(255,255,255,.72)}
:root[data-theme="light"] .kpi-bar{background:rgba(255,255,255,.9)}
:root[data-theme="light"] .stickybar-v2{background:rgba(255,255,255,.72)}

/* V2: Methodik-Unterreiter + Export-Aktionsgruppen + Hinweiskarte (Muster Umwelt-Dashboard). */
.method-subtabs-v2{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.method-subtabs-v2 button{background:var(--surface);border:1px solid var(--border);color:var(--text-muted);
  border-radius:999px;padding:6px 14px;font-size:.8rem;cursor:pointer}
.method-subtabs-v2 button:hover{border-color:var(--accent-border);color:var(--text)}
.method-subtabs-v2 button.active{background:var(--accent);border-color:var(--accent);color:var(--ink-on-accent);font-weight:700}
.exp-actions-v2{display:flex;gap:8px;flex-wrap:wrap}
.notice-card-v2{border-left:3px solid var(--accent)}
/* V2: TEW-Logo im Kopf (Groesse/Rahmen wie im Umwelt-Dashboard). */
.brand{display:flex;align-items:center;gap:12px}
.logo-tew-v2{flex:0 0 auto;width:104px;height:36px;border-radius:6px;background:#0874ba;overflow:hidden;display:flex;align-items:center;justify-content:center}
.logo-tew-v2 img{display:block;width:100%;height:100%;object-fit:contain}
.brand-txt-v2{display:block;min-width:0}

.split-wide-v2{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
.split-wide-v2 .live-col{position:sticky;top:130px}
@media(max-width:1200px){.split-wide-v2{grid-template-columns:1fr}.split-wide-v2 .live-col{position:static}}
@media print{.split-v2,.split-wide-v2{display:block}}
/* V2: Export-Tab-Bausteine (Nummern-Badges, Auswahlraster) wie im Umwelt-Dashboard. */
.exp-badge-v2{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;
  background:var(--accent);color:var(--ink-on-accent);font-size:11px;font-weight:700;margin-right:8px}
.exp-grid-v2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px}
.exp-item-v2{display:flex;align-items:center;gap:7px;font-size:.84rem;background:var(--surface-alt);
  border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 10px;cursor:pointer}
.exp-item-v2:hover{border-color:var(--accent-border)}
/* V3: Simulator - Buehne (grosse Bruecke) + schmales Reglerpanel rechts, einklappbar. */
.sim-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start;transition:grid-template-columns .22s cubic-bezier(.77,0,.175,1)}
.sim-wrap.panel-closed{grid-template-columns:minmax(0,1fr) 34px}
.sim-wrap.panel-closed .sim-panel-inner{opacity:0;pointer-events:none}
.sim-stage{min-width:0}
.sim-chart-card{margin-bottom:0}
.sim-chart{width:100%}
.sim-chart svg{width:100%;height:auto;min-height:420px}
/* V4 Simulator Simple/Expert */
.sim-mode-v4{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.sim-mode-lab-v4{font-size:12px;opacity:.7;text-transform:uppercase;letter-spacing:.04em}
.sim-mode-seg-v4{margin:0}
.sim-mode-hint-v4{flex:1 1 220px;min-width:0}
/* Alle sechs Kacheln gleich gross (Anwenderwunsch): festes Raster statt einer breiten
   Sonderkachel, gleiche Zeilenhoehe ueber grid-auto-rows und eine einheitliche Grafikflaeche.
   Die SVGs skalieren ueber viewBox, deshalb genuegt eine feste Hoehe am Container. */
/* Alle sechs Kacheln gleich gross (Anwenderwunsch): keine breite Sonderkachel mehr, gleiche
   Zeilenhoehe ueber grid-auto-rows, gleiche Grafikflaeche ueber eine feste SVG-Hoehe.
   auto-fit statt fester Spaltenzahl, weil der Inhaltsbereich schmaler ist als das Fenster
   (Sidebar) - eine Medienabfrage auf die Fensterbreite griffe hier zu spaet.
   Die Lesehilfen sind fuer volle Breite geschrieben und wuerden die Kachel sonst auf ueber
   800 px strecken (gemessen); deshalb begrenzt und bei Bedarf scrollbar. */
.sim-grid-v4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:stretch;grid-auto-rows:1fr}
@media(max-width:820px){.sim-grid-v4{grid-template-columns:1fr}}
.sim-grid-v4>.card{margin-bottom:0;display:flex;flex-direction:column;min-width:0}
.sim-tile-v4>h3{flex:0 0 auto;margin-bottom:6px}
/* Feste Zeichenflaeche fuer alle sechs Kacheln. Wichtig: die aeltere Regel
   ".sim-chart svg{min-height:420px}" setzt sich sonst durch - min-height schlaegt
   max-height. Deshalb hier ausdruecklich zuruecksetzen. Die SVGs tragen eine viewBox und
   skalieren mit preserveAspectRatio="meet", werden also eingepasst, nicht verzerrt. */
.sim-tile-v4 svg,.sim-tile-v4 .sim-chart svg{width:100%;height:380px;min-height:380px;max-height:380px}
.sim-tile-v4 .sim-chart{width:100%}
.sim-tile-v4 .hint,.sim-tile-v4 p.hint{max-height:92px;overflow:auto;flex:0 1 auto;
 font-size:11.5px;line-height:1.5;padding-right:4px}
.sim-tile-v4 .hint::-webkit-scrollbar{width:6px}
.sim-tile-v4 .hint::-webkit-scrollbar-thumb{background:rgba(140,170,205,.35);border-radius:3px}
.sim-panel{position:sticky;top:120px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px;min-height:120px}
.sim-panel-inner{transition:opacity .18s ease}
.sim-panel-toggle{position:absolute;top:8px;left:-14px;width:28px;height:28px;border-radius:50%;
  background:var(--accent);color:var(--ink-on-accent);border:none;cursor:pointer;font-size:12px;line-height:1;
  box-shadow:0 2px 6px rgba(0,0,0,.35);z-index:2}
.sim-panel{position:sticky}
.sim-panel-title{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin:0 0 10px;font-weight:700}
.sim-slider{margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.sim-slider:last-of-type{border-bottom:none}
.sim-slider-head{display:flex;justify-content:space-between;align-items:baseline;font-size:.82rem;margin-bottom:5px}
.sim-slider-head b{font-family:var(--font-mono);color:var(--accent)}
.sim-slider-sub{font-size:.7rem;color:var(--text-muted);margin-top:3px}
.sim-slider input[type=range]{width:100%}
.sim-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.sim-kpi{background:var(--surface-alt);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px}
.sim-kpi span{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted)}
.sim-kpi b{font-family:var(--font-mono);font-size:1.05rem}
.sim-kpi.gut b{color:var(--success)}.sim-kpi.warnung b{color:var(--warning)}.sim-kpi.kritisch b{color:var(--danger)}
@media(max-width:1000px){.sim-wrap,.sim-wrap.panel-closed{grid-template-columns:1fr}.sim-panel{position:static}
  .sim-panel-toggle{display:none}.sim-wrap.panel-closed .sim-panel-inner{opacity:1;pointer-events:auto}}
@media print{.sim-panel{display:none}.sim-wrap{display:block}}
/* V3: Druck-Container - am Bildschirm unsichtbar, im Druck das Einzige was erscheint. */
#report-print{display:none}
@media print{
  body>*:not(#report-print){display:none!important}
  #report-print{display:block!important;background:#fff;color:#111;font-family:"Segoe UI",system-ui,sans-serif;padding:0}
  #report-print *{box-shadow:none!important;text-shadow:none!important;backdrop-filter:none!important}
  #report-print .rep-head-v3{border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:14px}
  #report-print .rep-head-v3 h1{font-size:20px;margin:0 0 4px;color:#111}
  #report-print .rep-meta-v3{font-size:11px;color:#444}
  #report-print .rep-block-v3{margin:0 0 16px;page-break-inside:avoid}
  #report-print .rep-break-v3{page-break-before:always}
  #report-print h2{font-size:14px;margin:0 0 6px;color:#111;border-bottom:1px solid #bbb;padding-bottom:3px}
  #report-print table{width:100%;border-collapse:collapse;font-size:10.5px}
  #report-print th,#report-print td{border:1px solid #bbb;padding:4px 6px;text-align:right;color:#111}
  #report-print th:first-child,#report-print td:first-child{text-align:left}

  #report-print .rep-foot-v3{margin-top:16px;padding-top:6px;border-top:1px solid #bbb;font-size:10px;color:#555}

}
/* V3: wandernder Lichtschein um das TEW-Logo - 1:1 das Muster .magic-logo aus dem
   Umwelt-Dashboard (rein dekorativ, bei reduzierter Bewegung statisch). */
.magic-logo-v2{position:relative;isolation:isolate;padding:8px;margin:-8px;display:inline-flex}
.magic-logo-v2::before{content:"";position:absolute;inset:2px;border-radius:10px;z-index:-1;pointer-events:none;
  background:radial-gradient(60px circle at center,rgba(108,162,206,.6),transparent 70%);
  background-repeat:no-repeat;background-size:220% 220%;opacity:.8;animation:magicLogoDriftV2 6s ease-in-out infinite}
.magic-logo-v2::after{content:"";position:absolute;inset:2px;border-radius:10px;z-index:-1;pointer-events:none;
  box-shadow:0 0 0 1px rgba(18,105,176,.25);opacity:.6;transition:opacity .35s ease}
.magic-logo-v2:hover::before{opacity:1}
.magic-logo-v2:hover::after{opacity:.9}
@keyframes magicLogoDriftV2{
  0%,100%{background-position:10% 25%}
  25%{background-position:90% 15%}
  50%{background-position:85% 85%}
  75%{background-position:15% 80%}
}
@media(prefers-reduced-motion:reduce){.magic-logo-v2::before{animation:none;transition:none;background-position:50% 50%}}

  help_s4baselinetype:"Womit vergleichst du? Die Baseline ist die Welt OHNE dein Projekt. „Ist-Zustand“ = was heute läuft, „Marktdurchschnitt“ = was üblich ist, „gesetzliches Minimum“ = was mindestens vorgeschrieben wäre. Je anspruchsvoller die Baseline, desto kleiner die ausgewiesene Einsparung — und desto belastbarer die Aussage.",

  ported_label:"Formel",
  m_bau:"BAU-Emission(Jahr) = Basisemission × Wachstumsfaktor, mit Wachstumsfaktor = 1 + (globales Gesamtwachstum% × p), wobei p = (Jahr − Basisjahr) / (Zieljahr − Basisjahr), begrenzt auf [0,1]. Der eingegebene Prozentsatz ist das GESAMTwachstum bis zum Zieljahr, kein Jahreswert: bei 1,5 % und 2023→2030 beträgt der Faktor im Zieljahr 1,015 (nicht 1,1098 wie bei 1,5 % p.a. mit Zinseszins). Das Wachstum steigt linear zwischen Basis- und Zieljahr an, nicht exponentiell. Formelversion: {fv}.",
  m_zielreduktion:"Zielreduktion je Scope (im Zieljahr, p=1) = Reglerwert (%) × BAU-Emission im Zieljahr. Die Zielreduktion bezieht sich damit auf die BAU-Projektion, nicht auf die Basisemission. In Zwischenjahren wird auch die Reduktion mit p verrechnet (linearer Pfad von 0 im Basisjahr bis zum vollen Zielwert im Zieljahr).",
  m_massnahmensumme:"Maßnahmensumme je Scope = Summe der Minderungswirkung aller diesem Scope zugeordneten Maßnahmen.",
  m_deckungsgrad:"Deckungsgrad = Maßnahmensumme ÷ Zielreduktion (im Zieljahr) × 100. Ohne Zielreduktion gibt es keinen Prozentwert: Zielreduktion=0 und Maßnahmensumme&gt;0 wird als 'kein Ziel · Maßnahmen wirken' ausgewiesen, Zielreduktion=0 und Maßnahmensumme=0 als 'kein Ziel gesetzt' (nichts gefordert, nichts offen). Beide Zustände gelten als erfüllt und gehen nicht in die Gesamt-Kennzahl ein. Die Gesamt-Kennzahl 'Deckungsgrad gesamt' ist bewusst das striktere Minimum der Scopes mit Zielreduktion, nicht der Durchschnitt.",
  m_erreichungsgrad:"Erreichungsgrad = Maßnahmensumme ÷ BAU-Emission (im Zieljahr) × 100 — zeigt den Anteil der gesamten BAU-Emission, der durch Maßnahmen adressiert ist (eine von Deckungsgrad unabhängige Zusatzkennzahl).",
  m_fehlbetrag:"Fehlbetrag = max(0; Zielreduktion − Maßnahmensumme).",
  m_restemission:"Restemission je Scope = BAU-Emission − Zielreduktion (der geplante Szenariopfad, unabhängig davon, ob Maßnahmen ihn tatsächlich decken — dafür steht der separate Deckungsgrad).",
  m_nettogesamt:"Netto-Gesamtemission = Σ Restemission (operative Emission gemäß Reduktionspfad, alle Scopes) − Neutralisierung (Anteil % der operativen Restemission, ebenfalls linear mit p hochgefahren).",
  m_ampel:"Ampel je Scope: gut ≥ 100% Deckungsgrad, Warnung ≥ 70%, kritisch &lt; 70%. Die KPI 'Deckungsgrad gesamt' zeigt bewusst das Minimum der drei Scope-Werte (strengster Fall), nicht den Durchschnitt.",
  m_nearjahr:"Nahjahr-Check: vergleicht die geplante operative Emission im Nahjahr mit einem einfachen linearen Nahjahr-Ziel (Basisemission gesamt × (1 − Nahjahr-Reduktionsziel%)) — ein von den Scope-Reglern unabhängiger Zwischen-Check.",
  ported_disclaimer_note:"Portiert aus reference/IDT_NetZero_Management_Tool_v5.html, Funktionen readInputs(), calcForYear(), measureSums(), coverage().",
  m_disclaimer:"Die Formeln bilden den Net-Zero-Reduktionspfad ab: BAU-Wachstum (linear zwischen Basis- und Zieljahr hochgefahren), Zielreduktion je Scope, Maßnahmen-Deckungsgrad, Neutralisierung und Netto-Emission. Das Tool ist ein Management- und Steuerungsinstrument; die Bewertung erfolgt je Scope inkl. Datenqualitäts-Tagging (A–D).",

  h_methodik:"Methodology",
  ported_label:"Formula",
  m_bau:"BAU emission(year) = baseline emission × growth factor, with growth factor = 1 + (global total growth% × p), where p = (year − base year) / (target year − base year), clamped to [0,1]. The percentage entered is the TOTAL growth to the target year, not an annual rate: with 1.5% and 2023→2030 the target-year factor is 1.015 (not 1.1098 as it would be for 1.5% p.a. compounded). Growth ramps up linearly between base and target year, not exponentially. Formula version: {fv}.",
  m_zielreduktion:"Target reduction per scope (in the target year, p=1) = slider value (%) × BAU emission in the target year. The target reduction therefore relates to the BAU projection, not to the baseline emission. In interim years the reduction is also scaled by p (a linear path from 0 in the base year to the full target value in the target year).",
  m_massnahmensumme:"Measures sum per scope = sum of the mitigation effect of all measures assigned to that scope.",
  m_deckungsgrad:"Coverage = measures sum ÷ target reduction (in the target year) × 100. Without a target reduction there is no percentage: target reduction=0 and measures sum&gt;0 is reported as 'no target · measures in effect', target reduction=0 and measures sum=0 as 'no target set' (nothing required, nothing open). Both states count as met and are excluded from the overall KPI. The overall 'coverage' KPI is deliberately the stricter minimum of the scopes that have a target reduction, not the average.",
  m_erreichungsgrad:"Achievement rate = measures sum ÷ BAU emission (in the target year) × 100 — shows the share of total BAU emissions addressed by measures (an additional metric, independent of coverage).",
  m_fehlbetrag:"Shortfall = max(0; target reduction − measures sum).",
  m_restemission:"Residual emission per scope = BAU emission − target reduction (the planned scenario path, regardless of whether measures actually cover it — that is what the separate coverage metric tracks).",
  m_nettogesamt:"Net total emissions = Σ residual emission (operational emission per the reduction path, all scopes) − neutralization (% share of operational residual emission, also ramped up linearly with p).",
  m_ampel:"Traffic light per scope: good ≥ 100% coverage, warning ≥ 70%, critical &lt; 70%. The 'overall coverage' KPI deliberately shows the minimum of the three scope values (strictest case), not the average.",
  m_nearjahr:"Near-year check: compares the planned operational emission in the near year against a simple linear near-year target (total baseline emission × (1 − near-year reduction target%)) — an interim check independent of the per-scope sliders.",
  ported_disclaimer_note:"Ported from reference/IDT_NetZero_Management_Tool_v5.html, functions readInputs(), calcForYear(), measureSums(), coverage().",
  m_disclaimer:"The formulas describe the net-zero reduction path: BAU growth (ramped up linearly between base and target year), target reduction per scope, measure coverage, neutralization and net emissions. The tool is a management and steering instrument; assessment is per scope, including data-quality tagging (A–D).",

const SCOPE_KEYS = ["scope1","scope2","scope3"];

/* Gültige Scope-Token einer Maßnahme: die drei Scopes plus die 15 Scope-3-Kategorien. */
const SCOPE_TOKENS = SCOPE_KEYS.concat(Array.from({length:15}, (_,i)=> "s3-"+String(i+1).padStart(2,"0")));
function isScopeToken(v){ return SCOPE_TOKENS.includes(String(v)); }

/* Defensiver Deep-Merge für Autosave/Share-Link/JSON-Import (Pendant zu mergeData() der Referenz):
   fehlende Gruppen/Felder kommen aus den Defaults, ältere Stände ohne quality/auditAnswers laufen weiter.

   Der Merge übernahm bisher jeden Skalar und jedes Array ungeprüft. Ein abgeschnittener Share-Link,
   eine von Hand editierte JSON-Datei oder ein Export eines anderen Tools konnte damit z. B.
   `massnahmen: "text"` oder `lang: "xx"` in den State schreiben — das Rendern brach danach stumm ab
   und das Tool war bis zum Reload tot. Deshalb erzwingt sanitizeState() unten die Grundstruktur. */
function isPlainObj(v){ return v!==null && typeof v==="object" && !Array.isArray(v); }
/* Eine Gruppe wird nur dann mit dem Rohwert ueberlagert, wenn dieser wirklich ein Objekt ist.
   `global: null`, `scopes: "bad"` oder `project: 5` fallen damit auf die Defaults zurueck,
   statt spaeter beim Feldzugriff einen TypeError auszuloesen (Audit NZ-003). */
function mergeGroup(defGroup, rawGroup){ return isPlainObj(rawGroup) ? Object.assign({}, defGroup, rawGroup) : Object.assign({}, defGroup); }

function migrateState(raw){
  if(!isPlainObj(raw)) raw = {};
  const def = defaultState();
  const s = {};
  for(const key of Object.keys(def)){
    const dv = def[key], rv = raw[key];
    if(isPlainObj(dv))            s[key] = mergeGroup(dv, rv);
    else if(Array.isArray(dv))    s[key] = Array.isArray(rv) ? rv : dv;
    else                          s[key] = (rv===undefined ? dv : rv);
  }
  if(!Array.isArray(s.auditAnswers) || s.auditAnswers.length!==12){
    s.auditAnswers = Array(12).fill("").map((_,i)=> (Array.isArray(raw.auditAnswers)? raw.auditAnswers[i] : "") || "");
  }
  // Altes Schema: scopes.*.wachstum (exponentiell je Scope) und neutralisierung.menge (absolut)
  SCOPE_KEYS.forEach(k=>{ if(isPlainObj(s.scopes[k])) delete s.scopes[k].wachstum; });
  if(isPlainObj(raw.neutralisierung) && raw.neutralisierung.menge!==undefined && raw.neutralisierung.prozent===undefined){
    s.neutralisierung.prozent = 0; // absoluter Alt-Wert nicht sauber umrechenbar - konservativ auf 0
    s.neutralisierung.beschreibung = raw.neutralisierung.beschreibung||"";
  }
  // Scope-3-Aufschluesselung: alte Einzelzahl wandert vollstaendig in Kategorie 1 (Summe bleibt identisch)
  if(!Array.isArray(raw.s3cats) || raw.s3cats.length!==15){
    s.s3cats = defaultState().s3cats.map(c=>({...c, value:0}));
    const oldS3 = isPlainObj(raw.scopes) && isPlainObj(raw.scopes.scope3) ? Number(raw.scopes.scope3.basisemission)||0 : 0;
    s.s3cats[0].value = oldS3;
    if(isPlainObj(raw.quality) && raw.quality.scope3) s.s3cats[0].quality = raw.quality.scope3;
  } else {
    s.s3cats = defaultState().s3cats.map((d,i)=> Object.assign({}, d, isPlainObj(raw.s3cats[i]) ? raw.s3cats[i] : {}));
  }
  if(isPlainObj(s.scopes.scope3)) delete s.scopes.scope3.basisemission;
  if(isPlainObj(s.quality)) delete s.quality.scope3;
  return sanitizeState(s, def);
}

/* Erzwingt die Grundstruktur, auf die Render- und Rechencode sich verlassen: iterierbare Listen bleiben
   Listen, Zahlen bleiben endliche Zahlen, Enums bleiben bekannte Werte. Beschaedigte oder fremde Staende
   laden abgespeckt, statt das Tool stumm zu blockieren oder NaN-KPIs zu erzeugen (Audit NZ-003). */
function sanitizeState(s, def){
  const num = (v, fb)=>{ const n = Number(v); return Number.isFinite(n) ? n : fb; };
  const str = v=> typeof v==="string" ? v : "";
  const grp = (key)=>{ if(!isPlainObj(s[key])) s[key] = Object.assign({}, def[key]); return s[key]; };
  const enumOf = (v, allowed, fb)=> allowed.includes(v) ? v : fb;

  s.lang = enumOf(s.lang, ["de","en"], def.lang);
  s.activeTab = enumOf(s.activeTab, TABS, def.activeTab);

  const proj = grp("project");
  ["basisjahr","nearjahr","zieljahr","nearreduktion"].forEach(k=> proj[k] = num(proj[k], def.project[k]));
  proj.name = str(proj.name);
  proj.verantwortlich = str(proj.verantwortlich);

  const glob = grp("global");
  glob.wachstum = num(glob.wachstum, def.global.wachstum);

  const neu = grp("neutralisierung");
  neu.prozent = num(neu.prozent, def.neutralisierung.prozent);
  neu.beschreibung = str(neu.beschreibung);
  neu.netNegativeMode = !!neu.netNegativeMode;
  neu.netNegativeJust = str(neu.netNegativeJust);

  grp("scopes"); grp("quality");
  SCOPE_KEYS.forEach(k=>{
    if(!isPlainObj(s.scopes[k])) s.scopes[k] = Object.assign({}, def.scopes[k]);
    s.scopes[k].reduktionsziel = num(s.scopes[k].reduktionsziel, def.scopes[k].reduktionsziel);
    if(k!=="scope3") s.scopes[k].basisemission = num(s.scopes[k].basisemission, def.scopes[k].basisemission);
  });
  ["scope1","scope2"].forEach(k=>{ s.quality[k] = enumOf(s.quality[k], ["A","B","C","D"], def.quality[k]); });

  s.s3cats = def.s3cats.map((d,i)=>{
    const c = Array.isArray(s.s3cats) && isPlainObj(s.s3cats[i]) ? s.s3cats[i] : {};
    return {no:d.no, value:num(c.value, 0), quality: enumOf(c.quality, ["A","B","C","D"], d.quality)};
  });

  s.nextMassnahmeId = Math.max(1, Math.round(num(s.nextMassnahmeId, 1)));
  if(!Array.isArray(s.massnahmen)) s.massnahmen = [];
  s.massnahmen = s.massnahmen.filter(isPlainObj).map(m=>({
    id: Math.round(num(m.id, 0)) || s.nextMassnahmeId++,
    name: str(m.name),
    scope: isScopeToken(m.scope) ? m.scope : "scope1",
    wirkung: num(m.wirkung, 0),
    jahr: Math.round(num(m.jahr, s.project.zieljahr))
  }));
  s.nextMassnahmeId = Math.max(s.nextMassnahmeId, ...s.massnahmen.map(m=>m.id+1));

  if(!Array.isArray(s.audit)) s.audit = [];
  s.audit = s.audit.filter(isPlainObj);
  if(!Array.isArray(s.auditAnswers) || s.auditAnswers.length!==12) s.auditAnswers = Array(12).fill("");
  s.auditAnswers = s.auditAnswers.map(str);

  const ci = grp("co2impact");
  ci.useManual = !!ci.useManual;
  ci.manualInput = num(ci.manualInput, 0);
  ci.period = Math.max(1, Math.round(num(ci.period, 1)));
  ci.basis = enumOf(ci.basis, ["annual","cumulative"], def.co2impact.basis);
  ci.projectName = str(ci.projectName);
  ci.mode = enumOf(ci.mode, ["auditable","generational"], def.co2impact.mode);
  ci.vehicleClass = str(ci.vehicleClass) || def.co2impact.vehicleClass;
  ci.vehicleGco2 = num(ci.vehicleGco2, def.co2impact.vehicleGco2);
  ci.forestSpecies = str(ci.forestSpecies) || def.co2impact.forestSpecies;
  ci.forestIncrement = num(ci.forestIncrement, def.co2impact.forestIncrement);
  /* Bewusste 0 bleibt 0 - sie ist eine echte (ungueltige) Eingabe und darf nicht durch 1000 ersetzt
     werden. Die Baum-Kachel meldet das anschliessend als blockierenden Fehler (Audit NZ-011). */
  ci.forestStemsPerHa = num(ci.forestStemsPerHa, def.co2impact.forestStemsPerHa);
  if(!isPlainObj(ci.overrides)) ci.overrides = {};

  const s4 = grp("scope4");
  if(!isPlainObj(s4.active)) s4.active = JSON.parse(JSON.stringify(def.scope4.active));
  s4.active.inputs = Object.assign({}, def.scope4.active.inputs, isPlainObj(s4.active.inputs) ? s4.active.inputs : {});
  Object.keys(s4.active.inputs).forEach(k=>{ s4.active.inputs[k] = num(s4.active.inputs[k], 0); });
  s4.active.lifetime = num(s4.active.lifetime, def.scope4.active.lifetime);
  s4.active.netCost = num(s4.active.netCost, def.scope4.active.netCost);
  if(!isPlainObj(s4.active.claims)) s4.active.claims = Object.assign({}, def.scope4.active.claims);
  if(!isPlainObj(s4.active.quality)) s4.active.quality = Object.assign({}, def.scope4.active.quality);
  if(!Array.isArray(s4.projects)) s4.projects = [];
  s4.projects = s4.projects.filter(isPlainObj);
  s4.nextId = Math.max(1, Math.round(num(s4.nextId, 1)));

  return s;
}

/* Scope-3-Helfer: Summe (Referenz s3Total) und schlechteste Kategorien-Qualität.
   Abweichung von der Referenz (dokumentiert): nur Kategorien mit Wert > 0 zählen für die
   Qualitäts-Aggregation — leere Kategorien würden das Aggregat sonst grundlos auf D ziehen. */
function s3Sum(){ return state.s3cats.reduce((a,c)=> a + Math.max(0, Number(c.value)||0), 0); }
function s3WorstQuality(){
  const used = state.s3cats.filter(c=> (Number(c.value)||0) > 0).map(c=>c.quality);
  return used.length ? worstQuality(used) : "C";
}
function qualityOf(scope){ return scope==="scope3" ? s3WorstQuality() : state.quality[scope]; }

/* Maßnahmen-Zuordnung: wie in der Referenz (scopeOf) können Scope-3-Maßnahmen einer
   konkreten Kategorie zugeordnet werden ("s3-01" … "s3-15"); rechnerisch zählen sie zu Scope 3. */
function measureScope(scope){ return String(scope).startsWith("s3-") ? "scope3" : scope; }
function measureScopeLabel(scope){
  const s = String(scope);
  if(s.startsWith("s3-")){
    const no = parseInt(s.slice(3), 10);
    return "S3." + no + " · " + t("s3cat_" + no);
  }
  return t(s);
}
let state = defaultState();

function t(key){ return DICT[state.lang][key] ?? key; }

/* HELP-Tooltips (wie im Schwestertool): info(key) liest help_*-Schlüssel aus dem DICT. */
function info(key){
  const txt = DICT[state.lang]["help_"+key];
  return txt ? `<span class="info" tabindex="0">i<span class="tip">${esc(txt)}</span></span>` : "";
}

/* Datenqualität A–D, 1:1 nach Referenz (QUALITY_LEVELS/RANK/worstQuality), vereinfacht auf
   eine Bewertung je Scope (die 15 Scope-3-Einzelkategorien der Referenz sind nicht Teil dieses Modells). */
const QUALITY_RANK = {A:4, B:3, C:2, D:1};
function worstQuality(vals){ return vals.reduce((worst,q)=> QUALITY_RANK[q]<QUALITY_RANK[worst]? q : worst, vals[0]||"C"); }
function qBadge(q){ return `<span class="qbadge q${(q||"C").toLowerCase()}">${t("quality_"+(q||"C"))}</span>`; }

/* Effektiver Faktorwert: Nutzer-Override vor Default; die zwei Lookup-Faktoren aus der Klassen-/Artenwahl. */
function co2Effective(id){
  const ov = state.co2impact.overrides[id];
  if(ov!==undefined && ov!==null && ov!=="" && isFinite(Number(ov))) return Number(ov);
  switch(id){
    case "uba_climate_damage_cost_2026_low": return 350;
    case "uba_climate_damage_cost_2026_equal_weighting": return 1000;
    case "uba_natural_gas_direct_2025": return 0.201;
    case "uba_german_power_mix_location_based_2024": return 0.343;
    case "uba_tremod_pkw_km": return Number(state.co2impact.vehicleGco2)||160;
    case "thuenen_forest_area_yield_table": return Number(state.co2impact.forestIncrement)||11;
    case "proxy_tree_equivalent": return Number(state.co2impact.forestIncrement)||11;
    default: return null;
  }
}
function co2IsOverride(id){
  const ov = state.co2impact.overrides[id];
  return ov!==undefined && ov!==null && ov!=="" && isFinite(Number(ov));
}
/* Sichere Formel-Zuordnung (kein eval). Rückgabe in outUnit des Faktors. */
function co2Evaluate(id, co2t){
  const v = co2Effective(id);
  switch(id){
    case "uba_climate_damage_cost_2026_low": return co2t * v;
    case "uba_climate_damage_cost_2026_equal_weighting": return co2t * v;
    case "uba_natural_gas_direct_2025": return v>0 ? (co2t*1000)/v : null;
    case "uba_german_power_mix_location_based_2024": return v>0 ? (co2t*1000)/v : null;
    case "uba_tremod_pkw_km": return v>0 ? (co2t*1000000)/v : null;
    case "thuenen_forest_area_yield_table": return v>0 ? co2t / v : null;
    case "proxy_tree_equivalent": {
      /* Kein `|| 1000`: eine bewusste 0 (oder ein ungueltiger Wert) darf nicht durch den Default
         ersetzt und als Ergebnis verkauft werden (Audit NZ-011). */
      const stems = Number(state.co2impact.forestStemsPerHa);
      if(!(v > 0) || !Number.isFinite(stems) || stems <= 0) return null;
      return (co2t / v) * stems;
    }
    default: return null;
  }
}
/* Formeltext mit eingesetzten aktuellen Zahlen (für Methodik & Audit). */
function co2FormulaText(id, co2t){
  const v = co2Effective(id), stems = Number(state.co2impact.forestStemsPerHa);
  const c = fmtNum(co2t,2);
  switch(id){
    case "uba_climate_damage_cost_2026_low":
    case "uba_climate_damage_cost_2026_equal_weighting": return `${c} t × ${fmtNum(v,0)} €/t`;
    case "uba_natural_gas_direct_2025":
    case "uba_german_power_mix_location_based_2024": return `(${c} t × 1.000) ÷ ${fmtNum(v,3)} kg/kWh`;
    case "uba_tremod_pkw_km": return `(${c} t × 1.000.000) ÷ ${fmtNum(v,0)} g/km`;
    case "thuenen_forest_area_yield_table": return `${c} t ÷ ${fmtNum(v,1)} t/ha/a`;
    case "proxy_tree_equivalent": return `(${c} t ÷ ${fmtNum(v,1)} t/ha/a) × ${fmtNum(stems,0)} ${t("co2_stems")}`;
    default: return "";
  }
}
function co2FactorLabel(id){ return t("co2f_"+id+"_label"); }
/* Quellen-Qualität nach Spec: A offiziell, B wissenschaftlich, C Proxy (eigene Semantik, nicht die Messdaten-Skala). */
function co2Badge(q){ return `<span class="qbadge q${(q||"C").toLowerCase()}">${t("co2q_"+(q||"C"))}</span>`; }
function co2ResultUnitLabel(f){ return f.outUnit==="trees" ? t("co2_unit_trees") : f.outUnit; }
function fmtImpact(v, unit){
  if(v===null || !isFinite(v)) return "–";
  const d = (unit==="ha") ? 3 : (unit==="€" ? 0 : (Math.abs(v)>=100?0:1));
  return fmtNum(v,d);
}

/* CO₂-Eingabewert: automatisch aus dem Rechner (Maßnahmenwirkung gesamt im Zieljahr, operative
   CO₂-Minderung t/Jahr) oder manuell überschrieben. */
function co2AutoValue(){
  try{ return Math.max(0, buildDashboardResult().totalMassnahmen); }catch(e){ return 0; }
}
/* Rohwert der Eingabe (bzw. der automatischen Uebernahme) - vor Anwendung des Zeitraums. */
function co2BaseValue(){
  if(state.co2impact.useManual){
    const v = Number(state.co2impact.manualInput);
    return Number.isFinite(v) ? Math.max(0, v) : 0;
  }
  return co2AutoValue();
}
/* Die tatsaechlich bewertete Menge. Bei Basis "jaehrlich" wird der Zeitraum angewendet;
   bei "kumuliert" ist die Eingabe bereits der Gesamtwert (Audit NZ-009).
   Der Automatikwert des NetZero-Tools ist die Massnahmenwirkung im Zieljahr, also ein Jahreswert. */
function co2Period(){ const n = Math.round(Number(state.co2impact.period)); return Number.isFinite(n) && n>=1 ? n : 1; }
function co2InputValue(){
  const base = co2BaseValue();
  return state.co2impact.basis === "cumulative" ? base : base * co2Period();
}
/* Ergebnisliste (aktiv, in Reihenfolge). */
function co2Results(){
  const co2t = co2InputValue();
  return CO2_FACTORS.filter(f=>f.status==="active").map(f=>({
    f, value: co2Evaluate(f.id, co2t), unit:f.outUnit, formula: co2FormulaText(f.id, co2t),
    override: co2IsOverride(f.id)
  }));
}

/* ===== V2: Export-Maschinerie nach dem Muster des TEW-Umwelt-Dashboards =====
   Die generischen Helfer (ZIP-Container, CRC32, Datei-Download, SVG-Rasterung, XML-Escaping)
   sind 1:1 aus TEW_Umwelt_Dashboard_V12.html uebernommen, damit beide Tools identisch
   funktionieren. Darunter die NetZero-spezifischen Adapter: welche Grafiken es gibt und
   welche Tabelle hinter jeder steckt. Der Management-Report bleibt wie gewuenscht separat. */
/* CRC-Tabelle fuer den ZIP-Container (xlsx ohne Fremd-Bibliothek) - gehoert zu crc32V51. */
const _crcTabV51=(function(){const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
function crc32V51(bytes){let c=0xFFFFFFFF;for(let i=0;i<bytes.length;i++)c=_crcTabV51[(c^bytes[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}

function zipStoreV51(files){
 const u16=n=>[n&0xFF,(n>>>8)&0xFF],u32=n=>[n&0xFF,(n>>>8)&0xFF,(n>>>16)&0xFF,(n>>>24)&0xFF];
 const enc=new TextEncoder();const parts=[];const central=[];let offset=0;
 files.forEach(f=>{
  const nameB=enc.encode(f.name),data=f.data,crc=crc32V51(data);
  const local=new Uint8Array([].concat(u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(nameB.length),u16(0)));
  parts.push(local,nameB,data);
  central.push(new Uint8Array([].concat(u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(nameB.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset))),nameB);
  offset+=local.length+nameB.length+data.length;
 });
 const cdStart=offset;let cdSize=0;central.forEach(a=>cdSize+=a.length);
 const eocd=new Uint8Array([].concat(u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(cdSize),u32(cdStart),u16(0)));
 const all=parts.concat(central,[eocd]);let total=0;all.forEach(a=>total+=a.length);
 const out=new Uint8Array(total);let p=0;all.forEach(a=>{out.set(a,p);p+=a.length;});return out;
}

function downloadBlobV51(blob,filename){const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},1500);}

function downloadTextV51(filename,mime,text){downloadBlobV51(new Blob([text],{type:mime}),filename);}

function sanitizeFileV51(name){return String(name).replace(/[\/\\:*?"<>|]+/g,"_").replace(/\s+/g,"_").replace(/_+/g,"_").replace(/^_|_$/g,"").slice(0,80)||"chart";}

function colNameV51(i){let s="";i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;}

function xmlEscV51(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function rasterizePngV51(res,filename,done,mime){
 const url=URL.createObjectURL(new Blob([res.svg],{type:"image/svg+xml;charset=utf-8"}));const img=new Image();
 img.onload=function(){const sc=2,cv=document.createElement("canvas");cv.width=res.w*sc;cv.height=res.h*sc;const ctx=cv.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);ctx.setTransform(sc,0,0,sc,0,0);ctx.drawImage(img,0,0,res.w,res.h);URL.revokeObjectURL(url);cv.toBlob(function(b){downloadBlobV51(b,filename);done&&done();},mime||"image/png",0.92);};
 img.onerror=function(){URL.revokeObjectURL(url);done&&done();};img.src=url;
}

/* Ein SVG standalone machen (weisser Grund, eigene Schriftfarbe) - Logik wie im Dashboard. */
function nzStandaloneSvgV2(chart){
  const div=document.createElement("div");
  div.style.cssText="position:fixed;left:-99999px;top:0;width:1200px";
  document.body.appendChild(div);
  div.innerHTML=chart.svg()||"";
  const svg=div.querySelector("svg");
  if(!svg){document.body.removeChild(div);return null;}
  const clone=svg.cloneNode(true);
  let w=1120,hh=360;const vb=svg.getAttribute("viewBox");
  if(vb){const p=vb.split(/\s+/).map(Number);if(p.length===4){w=p[2];hh=p[3];}}
  clone.setAttribute("width",w);clone.setAttribute("height",hh);
  clone.setAttribute("xmlns","http://www.w3.org/2000/svg");
  /* Werte-Beschriftung im Export abschaltbar (eigener Schalter, wie im Dashboard). */
  if(state.exportChartValues===false)[].slice.call(clone.querySelectorAll(".chart-value-label,.val-label")).forEach(n=>n.parentNode&&n.parentNode.removeChild(n));
  const NS="http://www.w3.org/2000/svg";
  const st=document.createElementNS(NS,"style");
  st.textContent="text{fill:#334155;font-family:'Segoe UI',system-ui,sans-serif}";
  const bg=document.createElementNS(NS,"rect");
  bg.setAttribute("x",0);bg.setAttribute("y",0);bg.setAttribute("width",w);bg.setAttribute("height",hh);bg.setAttribute("fill","#ffffff");
  clone.insertBefore(bg,clone.firstChild);clone.insertBefore(st,clone.firstChild);
  const str='<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(clone);
  document.body.removeChild(div);
  return {svg:str,w,h:hh,label:chart.label};
}

    ${schritt(1,en?"Calculator: enter the basics":"Rechner: Grunddaten eintragen",

        :"Projektname, Basisjahr, Zieljahr sowie je Scope die Basisemission und das Reduktionsziel. Ohne Basis- und Zieljahr lässt sich nichts rechnen — das Werkzeug sagt das ausdrücklich, statt eine Zahl zu zeigen.")}

    ${schritt(3,en?"Simulator: try scenarios":"Simulator: Szenarien durchspielen",
      en?"Move the sliders to see instantly how targets and measures change the path. Nothing is lost — the sliders write straight into the project."

    ${schritt(4,en?"Document assumptions":"Annahmen dokumentieren",
      en?"Under <b>Audit trail</b> record where your figures come from and what you assumed. This is what makes the result defensible in an audit."
        :"Unter <b>Audit-Trail</b> hältst du fest, woher deine Zahlen stammen und was du angenommen hast. Genau das macht das Ergebnis in einer Prüfung belastbar.")}
    ${schritt(5,en?"Export and save":"Exportieren und sichern",
      en?"Under <b>Export/Import</b> you find data exports, charts, the management report — and the project state to save."

/* V3: Rechenwege — vorher zeigte dieser Unterreiter den Audit-Teil (Fehlzuordnung). */
function rechenwegeInnerV3(){
  const en=state.lang==="en";
  const f=(t1,formel,txt)=>`<div style="margin:10px 0"><b>${t1}</b><div style="font-family:ui-monospace,Consolas,monospace;font-size:12.5px;margin:3px 0;opacity:.9">${formel}</div><span style="opacity:.85">${txt}</span></div>`;
  return `<div class="card"><h3>${en?"How the figures are calculated":"Wie die Zahlen zustande kommen"}</h3>
    ${f(en?"BAU path (business as usual)":"BAU-Pfad (ohne Gegenmaßnahmen)",
      en?"BAU(year) = baseline × (1 + growth × progress)":"BAU(Jahr) = Basisemission × (1 + Wachstum × Fortschritt)",
      en?"Growth is the total across the whole horizon, not per year; it ramps up linearly from the base year and is fully effective in the target year."
        :"Das Wachstum gilt für den gesamten Zeitraum, nicht je Jahr; es steigt vom Basisjahr an linear und wirkt im Zieljahr vollständig.")}
    ${f(en?"Target reduction":"Zielreduktion",
      en?"target = BAU(target year) × reduction target %":"Zielreduktion = BAU(Zieljahr) × Reduktionsziel %",
      en?"The target is measured against the BAU path, not against the base year — that is the stricter and the usual reading."
        :"Das Ziel bemisst sich am BAU-Pfad, nicht am Basisjahr — das ist die strengere und die übliche Lesart.")}
    ${f(en?"Coverage (per scope)":"Deckungsgrad (je Scope)",
      en?"coverage = measures in this scope ÷ target reduction of this scope":"Deckungsgrad = Maßnahmen dieses Scopes ÷ Zielreduktion dieses Scopes",
      en?"Above 100 % the measures more than cover that scope's target; below, the gap is the shortfall."
        :"Über 100 % tragen die Maßnahmen mehr als das Ziel dieses Scopes verlangt; darunter ist die Lücke der Fehlbetrag.")}
    ${f(en?"Overall coverage — the weakest scope":"Gesamt-Deckungsgrad — der schwächste Scope",
      en?"overall = MINIMUM of the scope coverages (not their average)":"Gesamt = MINIMUM der Scope-Deckungsgrade (nicht deren Mittelwert)",
      en?"Deliberately conservative: a scope without measures pulls the overall figure to 0 %, even if another scope is fully covered. That is why the number can stay at 0 % although measures exist — a strong Scope 1 must not paper over an untouched Scope 2. Scopes without a target are not counted."
        :"Bewusst konservativ: Ein Scope ohne Maßnahmen zieht den Gesamtwert auf 0 %, auch wenn ein anderer Scope vollständig gedeckt ist. Deshalb kann die Zahl bei 0 % stehen, obwohl Maßnahmen vorhanden sind — ein starker Scope 1 soll einen unbearbeiteten Scope 2 nicht überdecken. Scopes ohne Ziel zählen nicht mit.")}
    ${f(en?"Net emission":"Netto-Emission",
      en?"net = BAU(target year) − target reduction − neutralisation":"Netto = BAU(Zieljahr) − Zielreduktion − Neutralisierung",
      en?"Careful: this subtracts the TARGET, not the measures — it shows what remains <b>if the target is met</b>. Whether the measures actually carry that target is answered by the coverage, not by this figure. Neutralisation is shown separately: reduction first, compensation last."
        :"Wichtig: Abgezogen wird das ZIEL, nicht die Maßnahmen — die Zahl zeigt, was übrig bleibt, <b>wenn das Ziel erreicht wird</b>. Ob die Maßnahmen dieses Ziel tatsächlich tragen, beantwortet der Deckungsgrad, nicht dieser Wert. Die Neutralisierung steht getrennt: erst reduzieren, dann kompensieren.")}
    <p class="hint">${en
      ? "Rounding happens only for display; the calculation runs on unrounded values. Sources and assumptions belong under Audit trail, the factors for the equivalents are listed there too."
      : "Gerundet wird nur für die Anzeige, gerechnet mit ungerundeten Werten. Quellen und Annahmen gehören unter Audit-Trail, dort stehen auch die Faktoren der Äquivalente."}</p>
  </div>`
  + `<div class="card"><h3>${en?"How the four Big-Picture charts are built":"Wie die vier Big-Picture-Grafiken entstehen"}</h3>
    ${f(en?"Which measure contributes most?":"Welche Maßnahme trägt am meisten?",
      en?"share = effect of the measure ÷ sum of all measure effects":"Anteil = Wirkung der Maßnahme ÷ Summe aller Maßnahmenwirkungen",
      en?"Sorted descending, so the top bars are where the plan actually stands or falls. The percentage refers to the recorded measures, not to the target — if the measures do not cover the target, 100 % here is still not the target reached."
        :"Absteigend sortiert, oben steht also, woran der Plan wirklich hängt. Der Prozentwert bezieht sich auf die erfassten Maßnahmen, nicht auf das Ziel — decken die Maßnahmen das Ziel nicht, sind 100 % hier trotzdem nicht das erreichte Ziel.")}
    ${f(en?"Where is the gap?":"Wo klafft die Lücke?",
      en?"bar = measures of the scope ÷ target reduction of the scope":"Balken = Maßnahmen des Scopes ÷ Zielreduktion des Scopes",
      en?"Same arithmetic as the coverage above, per scope. A scope that carries emissions but has <b>no</b> reduction target appears as a dashed row with its tonnage — it is deliberately not hidden, because that volume is in the balance and in no coverage figure."
        :"Dieselbe Rechnung wie der Deckungsgrad oben, je Scope. Ein Scope mit Emissionen, aber <b>ohne</b> Reduktionsziel erscheint als gestrichelte Zeile mit seiner Menge — er wird bewusst nicht ausgeblendet, denn diese Menge steht in der Bilanz und in keiner Deckungszahl.")}
    ${f(en?"Does the effect arrive in time?":"Kommt die Wirkung rechtzeitig?",
      en?"curve = measure effects cumulated by their year of full effect":"Kurve = Maßnahmenwirkungen, kumuliert nach ihrem Jahr der vollen Wirkung",
      en?"A step function, not a smooth ramp: each measure is booked in full in its year. Real measures ramp up over months — the curve is therefore optimistic on timing."
        :"Eine Treppenfunktion, keine sanfte Rampe: Jede Maßnahme wird in ihrem Jahr vollständig gebucht. Echte Maßnahmen laufen über Monate an — die Kurve ist zeitlich also optimistisch.")}
    ${f(en?"How does the plan compare to SBTi, EU and IPCC?":"Wie steht der Plan zu SBTi, EU und IPCC?",
      en?"path(year) = base emissions × (1 − rate × years since base year)":"Pfad(Jahr) = Basisemissionen × (1 − Rate × Jahre seit Basisjahr)",
      en?"All pathways are linear and normalised to <b>your</b> base year, so the lines are comparable in shape. Rates: SBTi 1.5 °C −4.2 %-points p.a. (Corporate Net-Zero Standard), SBTi well-below 2 °C −2.5, IPCC 1.5 °C −2.25 (SR1.5, −45 % by 2030 vs 2010), EU Fit for 55 −1.375 (Reg. (EU) 2021/1119, −55 % by 2030 vs 1990). <b>The reference years differ</b> — EU and IPCC are economy-wide and global targets and are shown for orientation only, never as a company target."
        :"Alle Pfade sind linear und auf <b>Ihr</b> Basisjahr normiert, die Linien sind also in der Form vergleichbar. Raten: SBTi 1,5 °C −4,2 %-Punkte p. a. (Corporate Net-Zero Standard), SBTi deutlich unter 2 °C −2,5, IPCC 1,5 °C −2,25 (SR1.5, −45 % bis 2030 ggü. 2010), EU Fit for 55 −1,375 (VO (EU) 2021/1119, −55 % bis 2030 ggü. 1990). <b>Die Bezugsjahre unterscheiden sich</b> — EU und IPCC sind volkswirtschaftliche bzw. globale Ziele und stehen nur zur Einordnung, nie als Unternehmensziel.")}
  </div>`;
}
function tabMethodikV2(){
  /* V3 (Anwenderwunsch 27.07.): neuer Unterreiter "Bedienung" (User Guide). Der Audit-Teil ist
     aus "Rechenwege" ausgezogen und lebt jetzt vollstaendig im Reiter Audit-Trail — dort
     gehoeren Nachweise hin, hier stehen Rechenwege. */
  const views=[["warum",t("tab_warum")],["guide",state.lang==="en"?"How to use":"Bedienung"],["doku",t("m_sub_doku")],["glossar",t("tab_glossar")]];
  if(!state.methodikView||!views.some(v=>v[0]===state.methodikView))state.methodikView="warum";
  const bar=`<div class="method-subtabs-v2">${views.map(([k,lab])=>`<button class="${state.methodikView===k?"active":""}" data-mview="${k}">${lab}</button>`).join("")}</div>`;
  let inner="";
  if(state.methodikView==="warum")inner=`<div class="card"><p>${t("p_warum1")}</p><p>${t("p_warum2")}</p><p>${t("p_warum3")}</p><p>${t("p_warum4")}</p></div>`;

}

/* Hell-/Dunkel-Umschalter: Auswahl in localStorage, System-Einstellung als Startwert. */
function applyThemeV2(){
  const th=state.theme||localStorage.getItem("nz_theme")||(window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");
  state.theme=th;
  document.documentElement.setAttribute("data-theme",th);

  const b=document.getElementById("btnTheme");

/* Spotlight: weicher Lichtschein um den Mauszeiger auf Karten. Per requestAnimationFrame
   gebuendelt (ein Read+Write je Frame), deaktiviert bei Touch und reduzierter Bewegung. */
function initSpotlightV2(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  if(window.matchMedia("(pointer: coarse)").matches)return;
  document.body.classList.add("spotlight-on");
  let cur=null,pend=null,raf=null;
  function apply(){
    raf=null;const ev=pend;pend=null;if(!ev)return;
    const el=ev.target.closest?ev.target.closest(".card"):null;
    if(el){const r=el.getBoundingClientRect();el.style.setProperty("--sx",(ev.clientX-r.left)+"px");el.style.setProperty("--sy",(ev.clientY-r.top)+"px");
      if(cur&&cur!==el){cur.style.removeProperty("--sx");cur.style.removeProperty("--sy");}cur=el;}
    else if(cur){cur.style.removeProperty("--sx");cur.style.removeProperty("--sy");cur=null;}
  }
  document.addEventListener("mousemove",e=>{pend=e;if(raf==null)raf=requestAnimationFrame(apply);},{passive:true});
}
/* Vollbild je Grafik-Karte: Button wird nach jedem Render in Karten mit SVG/Tabelle eingesetzt. */
let vollbildCardV2=null;
function exitVollbildV2(){
  if(!vollbildCardV2)return;
  vollbildCardV2.card.classList.remove("is-vollbild");
  /* V3-Fix: Karte an ihren urspruenglichen Platz zurueckstellen (siehe toggleVollbildV2). */
  if(vollbildCardV2.platzhalter&&vollbildCardV2.platzhalter.parentNode){
    vollbildCardV2.platzhalter.parentNode.replaceChild(vollbildCardV2.card,vollbildCardV2.platzhalter);
  }
  vollbildCardV2.backdrop.remove();
  document.removeEventListener("keydown",escVollbildV2);
  vollbildCardV2=null;
}
function escVollbildV2(e){if(e.key==="Escape")exitVollbildV2();}
function toggleVollbildV2(card){
  if(vollbildCardV2&&vollbildCardV2.card===card){exitVollbildV2();return;}
  if(vollbildCardV2)exitVollbildV2();
  const bd=document.createElement("div");bd.className="vollbild-backdrop";bd.onclick=exitVollbildV2;
  document.body.appendChild(bd);
  /* V3-Fix (Review 27.07.2026, Anwenderfund "im Vollbild erscheint nur so etwas"):
     Die Karte blieb an ihrem Platz im Layout. Liegt ueber ihr ein Elternelement mit eigenem
     Stacking-Context (transform / filter / backdrop-filter — im Split-Layout und beim
     Spotlight der Fall), dann bezieht sich ihr position:fixed auf dieses Elternteil und ihr
     z-index gilt nur INNERHALB davon: Die Karte landete hinter der Abdunklung und ragte
     ueber den Rand. Loesung: Karte fuer die Dauer des Vollbilds direkt an <body> haengen und
     die Luecke im Layout mit einem Platzhalter offenhalten. */
  const ph=document.createComment("vollbild-platzhalter-v3");
  if(card.parentNode)card.parentNode.replaceChild(ph,card);
  document.body.appendChild(card);
  card.classList.add("is-vollbild");
  document.addEventListener("keydown",escVollbildV2);
  vollbildCardV2={card,backdrop:bd,platzhalter:ph};
}
function injectVollbildButtonsV2(){
  document.querySelectorAll("#mainContent .card").forEach(card=>{
    if(card.querySelector(".vb-btn"))return;
    /* V3-Fix (Review 27.07.2026, Anwenderfund "der Fullscreen-Button macht dort keinen Sinn"):
       Bisher genuegte irgendein <svg> ODER irgendeine <table> in der Karte. Damit bekamen auch
       Eingabemasken einen Vollbild-Knopf — "Scope-Parameter" (37 Eingabefelder) und
       "Massnahmen" nutzen eine Tabelle nur als Layout-Gerüst, nicht als Datenausgabe.
       Jetzt: nur Karten mit einem echten Diagramm (grosses SVG, keine Icons) oder einer
       reinen Datentabelle; Karten, die ueberwiegend aus Eingabefeldern bestehen, nie. */
    const eingaben=card.querySelectorAll("input,select,textarea").length;
    const diagramm=[...card.querySelectorAll("svg")].some(s=>{
      const b=s.getBoundingClientRect();return b.width>=200&&b.height>=120;
    });
    const datentabelle=!!card.querySelector("table")&&eingaben===0;
    if(eingaben>2&&!diagramm)return;
    if(!diagramm&&!datentabelle)return;
    const head=card.querySelector("h3");if(!head)return;
    const b=document.createElement("button");
    b.type="button";b.className="vb-btn no-print";b.textContent=t("fullscreen");
    b.onclick=()=>toggleVollbildV2(card);
    head.appendChild(b);
  });
}

  waste_heat_replaces_primary_heat: ["recovered_heat_kwh","reference_heat_efficiency","reference_heat_factor_kg_per_kwh","auxiliary_energy_kwh","auxiliary_energy_factor_kg_per_kwh"],
  compressed_air_efficiency:        ["baseline_electricity_kwh","project_electricity_kwh","electricity_factor_kg_per_kwh"],
  material_substitution:            ["baseline_material_quantity","baseline_material_factor_kg_per_unit","project_material_quantity","project_material_factor_kg_per_unit"],
  generic:                          ["baseline_activity","baseline_factor","project_activity","project_factor"]
};
const S4_TEMPLATE_IDS = Object.keys(S4_TEMPLATES);

/* Sichere Formel-Zuordnung (Baseline/Projekt in t CO₂e/a), 1:1 aus Spec §6. */
/* ============================= VALIDIERUNGSKERN (Audit NZ-002/006/007/008) =============================
   Eine Stelle entscheidet, ob ein Wert überhaupt rechenbar ist. Kein `|| 1`, kein `|| 0` auf Divisoren:
   0 ist eine echte Eingabe und darf nicht stillschweigend zu 1 werden. Ergebnisse tragen `valid` und
   `errors`; alles, was färbt, entscheidet oder exportiert, muss `valid` prüfen. */

const MAX_FINITE = 1e12;   // Obergrenze für Emissionen/Aktivitäten — darüber ist keine Bilanz plausibel
const MAX_FACTOR = 1e6;    // Obergrenze für Emissionsfaktoren

function isFiniteNum(v){ return typeof v==="number" && Number.isFinite(v); }

/* Divisor: muss endlich und echt größer als 0 sein. 1e-320 (subnormal) fliegt hier raus,
   weil die Division danach nach Infinity überläuft. */
/* Sprechender Feldname für Fehlermeldungen. Fällt auf den technischen Namen zurück,
   nie auf einen sichtbaren Übersetzungsschlüssel. */
function fieldLabel(field){
  const dict = DICT[state.lang] || DICT.de;
  return dict["s4i_"+field] || dict["f_"+field] || field;
}
function requirePositiveFinite(value, field, errors){
  const n = Number(value);
  /* 1e-320 ist endlich und > 0, die anschließende Division läuft aber nach Infinity über.
     Deshalb gilt eine praktische Untergrenze statt eines reinen >0-Tests (Audit NZ-007). */
  if(!Number.isFinite(n) || n <= 0 || n < 1e-9){
    errors.push({field, key:"err_divisor", msg:t("err_divisor").replace("{field}", fieldLabel(field))});
    return null;
  }
  return n;
}
/* Nicht-negative endliche Mengen/Faktoren. */
function requireNonNegativeFinite(value, field, errors, max=MAX_FINITE){
  const n = Number(value);
  if(!Number.isFinite(n)){ errors.push({field, key:"err_notfinite", msg:t("err_notfinite").replace("{field}", fieldLabel(field))}); return null; }
  if(n < 0){ errors.push({field, key:"err_negative", msg:t("err_negative").replace("{field}", fieldLabel(field))}); return null; }
  if(n > max){ errors.push({field, key:"err_toolarge", msg:t("err_toolarge").replace("{field}", fieldLabel(field))}); return null; }
  return n;
}
/* Invariante nach jeder Rechenstufe: kein NaN/Infinity darf weiterlaufen. */
function assertFinite(obj, keys, errors, where){
  for(const k of keys){
    if(!isFiniteNum(obj[k])){
      errors.push({field:where+"."+k, key:"err_nonfinite_stage", msg:t("err_nonfinite_stage").replace("{stage}", where)});
      return false;
    }
  }
  return true;
}

function s4Compute(a){
  /* Liefert {valid, errors, baseline, project}. Divisoren (Wirkungsgrad, JAZ/COP) werden validiert,
     statt per `|| 1` still auf 1 gesetzt zu werden (Audit NZ-002). Bei ungültigem Divisor gibt es
     KEIN Zahlenergebnis — ein plausibel aussehender Wert wäre schlimmer als gar keiner. */
  const errors = [];
  const q = (k, max) => requireNonNegativeFinite(a.inputs[k], k, errors, max);   // Menge/Aktivität
  const f = k => requireNonNegativeFinite(a.inputs[k], k, errors, MAX_FACTOR);   // Emissionsfaktor
  const d = k => requirePositiveFinite(a.inputs[k], k, errors);                  // Divisor

  let baseline = null, project = null;
  switch(a.template){
    case "pv_avoided_grid_electricity": {
      const gen=q("annual_generation_kwh"), gf=f("grid_emission_factor_kg_per_kwh"), pf=f("pv_project_factor_kg_per_kwh");
      if(!errors.length){ baseline = gen*gf/1000; project = gen*pf/1000; }
      break;
    }
    case "power_to_heat_replaces_gas_boiler": {
      const heat=q("useful_heat_kwh"), eff=d("gas_boiler_efficiency"), gf=f("gas_factor_kg_per_kwh"),
            el=q("electricity_kwh"), ef=f("electricity_factor_kg_per_kwh");
      if(!errors.length){ baseline = heat/eff*gf/1000; project = el*ef/1000; }
      break;
    }
    case "heat_pump_replaces_gas_heat": {
      const heat=q("useful_heat_kwh"), eff=d("gas_boiler_efficiency"), gf=f("gas_factor_kg_per_kwh"),
            cop=d("seasonal_cop"), ef=f("electricity_factor_kg_per_kwh");
      if(!errors.length){ baseline = heat/eff*gf/1000; project = heat/cop*ef/1000; }
      break;
    }
    case "waste_heat_replaces_primary_heat": {
      const rec=q("recovered_heat_kwh"), eff=d("reference_heat_efficiency"), rf=f("reference_heat_factor_kg_per_kwh"),
            aux=q("auxiliary_energy_kwh"), af=f("auxiliary_energy_factor_kg_per_kwh");
      if(!errors.length){ baseline = rec/eff*rf/1000; project = aux*af/1000; }
      break;
    }
    case "compressed_air_efficiency": {
      const b=q("baseline_electricity_kwh"), pr=q("project_electricity_kwh"), ef=f("electricity_factor_kg_per_kwh");
      if(!errors.length){ baseline = b*ef/1000; project = pr*ef/1000; }
      break;
    }
    case "material_substitution": {
      const bq=q("baseline_material_quantity"), bf=f("baseline_material_factor_kg_per_unit"),
            pq=q("project_material_quantity"), pf=f("project_material_factor_kg_per_unit");
      if(!errors.length){ baseline = bq*bf/1000; project = pq*pf/1000; }
      break;
    }
    case "generic": default: {
      const ba=q("baseline_activity"), bf=f("baseline_factor"), pa=q("project_activity"), pf=f("project_factor");
      if(!errors.length){ baseline = ba*bf/1000; project = pa*pf/1000; }
      break;
    }
  }
  if(errors.length) return {valid:false, errors, baseline:null, project:null};
  if(!assertFinite({baseline, project}, ["baseline","project"], errors, "s4Compute"))
    return {valid:false, errors, baseline:null, project:null};
  return {valid:true, errors:[], baseline, project};
}

function s4FormulaText(a){
  const g = k => fmtNum(Number(a.inputs[k])||0, (Number(a.inputs[k])||0)<1?3:0);
  switch(a.template){
    case "pv_avoided_grid_electricity": return `Baseline = ${g("annual_generation_kwh")} kWh × ${g("grid_emission_factor_kg_per_kwh")} ÷ 1000; Projekt = … × ${g("pv_project_factor_kg_per_kwh")} ÷ 1000`;
    case "power_to_heat_replaces_gas_boiler": return `Baseline = ${g("useful_heat_kwh")} ÷ ${g("gas_boiler_efficiency")} × ${g("gas_factor_kg_per_kwh")} ÷ 1000; Projekt = ${g("electricity_kwh")} × ${g("electricity_factor_kg_per_kwh")} ÷ 1000`;
    case "heat_pump_replaces_gas_heat": return `Baseline = ${g("useful_heat_kwh")} ÷ ${g("gas_boiler_efficiency")} × ${g("gas_factor_kg_per_kwh")} ÷ 1000; Projekt = ${g("useful_heat_kwh")} ÷ ${g("seasonal_cop")} (JAZ) × ${g("electricity_factor_kg_per_kwh")} ÷ 1000`;
    case "waste_heat_replaces_primary_heat": return `Baseline = ${g("recovered_heat_kwh")} ÷ ${g("reference_heat_efficiency")} × ${g("reference_heat_factor_kg_per_kwh")} ÷ 1000; Projekt = ${g("auxiliary_energy_kwh")} × ${g("auxiliary_energy_factor_kg_per_kwh")} ÷ 1000`;
    case "compressed_air_efficiency": return `Baseline = ${g("baseline_electricity_kwh")} × ${g("electricity_factor_kg_per_kwh")} ÷ 1000; Projekt = ${g("project_electricity_kwh")} × … ÷ 1000`;
    case "material_substitution": return `Baseline = ${g("baseline_material_quantity")} × ${g("baseline_material_factor_kg_per_unit")} ÷ 1000; Projekt = ${g("project_material_quantity")} × ${g("project_material_factor_kg_per_unit")} ÷ 1000`;
    default: return `Baseline = ${g("baseline_activity")} × ${g("baseline_factor")} ÷ 1000; Projekt = ${g("project_activity")} × ${g("project_factor")} ÷ 1000`;
  }
}
/* Datenqualitätsindex 0–100 (7 Kriterien, Spec §7). */
const S4_QUALITY_POINTS = {q1:20,q2:20,q3:20,q4:15,q5:10,q6:10,q7:5};
function s4Confidence(a){ return Object.keys(S4_QUALITY_POINTS).reduce((s,k)=> s + (a.quality[k]?S4_QUALITY_POINTS[k]:0), 0); }
function s4ConfidenceClass(score){ return score>=80?"conf_high":score>=60?"conf_ok":score>=40?"conf_internal":"conf_none"; }
function s4ConfidenceTone(score){ return score>=80?"gut":score>=60?"warnung":score>=40?"warnung":"kritisch"; }
/* Claim-Check: alle 6 Pflicht-Checkboxen → berichtsfähig. */
function s4ClaimOk(a){ return ["c1","c2","c3","c4","c5","c6"].every(k=>a.claims[k]); }
/* Vollständiges Ergebnis. UBA-Geldwerte aus zentraler Faktorbasis (co2Effective), nicht hart in der UI. */
function s4Result(a){
  /* Strukturiertes Ergebnis: bei blockierenden Fehlern gibt es keine Zahlen, keine Berichtsfähigkeit
     und keinen grünen Status (Audit NZ-002/NZ-006/NZ-007). */
  const errors = [];
  const c = s4Compute(a);
  errors.push(...c.errors);

  const lifeRaw = Number(a.lifetime);
  let life = null;
  if(!Number.isFinite(lifeRaw) || lifeRaw < 1 || lifeRaw > 200){
    errors.push({field:"lifetime", key:"err_lifetime", msg:t("err_lifetime")});
  } else {
    life = Math.round(lifeRaw);
  }
  const netCostRaw = Number(a.netCost);
  if(!Number.isFinite(netCostRaw)) errors.push({field:"netCost", key:"err_notfinite", msg:t("err_notfinite").replace("{field}", t("s4_f_netcost"))});

  const confidence = s4Confidence(a);
  const base = {
    valid:false, errors,
    baseline:null, project:null, annual:null, lifetime:null, life,
    avoidanceCost:null, ubaLow:null, ubaEqual:null,
    confidence, confClass:s4ConfidenceClass(confidence), confTone:s4ConfidenceTone(confidence),
    claimOk:false, reportable:false
  };
  if(errors.length) return base;

  const annual = c.baseline - c.project;
  const lifetime = annual * life;
  const netCost = netCostRaw;
  const avoidanceCost = lifetime > 0 ? netCost/lifetime : null;
  const ubaLow = lifetime * co2Effective("uba_climate_damage_cost_2026_low");
  const ubaEqual = lifetime * co2Effective("uba_climate_damage_cost_2026_equal_weighting");

  if(!assertFinite({annual, lifetime, ubaLow, ubaEqual}, ["annual","lifetime","ubaLow","ubaEqual"], errors, "s4Result"))
    return base;

  const claimOk = s4ClaimOk(a);
  return {valid:true, errors:[],
          baseline:c.baseline, project:c.project, annual, lifetime, life,
          avoidanceCost, ubaLow, ubaEqual,
          confidence, confClass:s4ConfidenceClass(confidence), confTone:s4ConfidenceTone(confidence),
          claimOk, reportable:claimOk};
}

function s4Warnings(a){
  const w = [];
  const r = s4Result(a);
  /* Blockierende Rechenfehler stehen vorn und sind als solche gekennzeichnet. */
  r.errors.forEach(e=> w.push("■ "+e.msg));
  if(!(a.baselineJust||"").trim()) w.push(t("s4w_baselinejust"));
  if(!a.baselineSourceId || !a.projectSourceId) w.push(t("s4w_source"));
  if(r.valid && r.annual < 0) w.push(t("s4w_negative"));
  if(a.doubleCounting==="high") w.push(t("s4w_doublecount"));
  if(r.valid && r.avoidanceCost===null && Number(a.netCost)>0) w.push(t("s4w_costnolife"));
  if(!r.claimOk) w.push(t("s4w_claim"));
  return w;
}
