/* ============================= CALC CORE =============================
   Ported 1:1 from reference/IDT_NetZero_Management_Tool_v5.html:
   readInputs(), calcForYear(year), measureSums(), coverage(final).
   Scope keys are named scope1/scope2/scope3 here (vs. s1/s2/s3 in the reference). */
function readInputs(){
  const p = state.project;
  const s1 = state.scopes.scope1.basisemission, s2 = state.scopes.scope2.basisemission, s3 = s3Sum();
  return {
    baseYear:p.basisjahr, nearYear:p.nearjahr, targetYear:p.zieljahr, nearReductionPct:p.nearreduktion,
    s1, s2, s3, total:s1+s2+s3,
    growthPct: state.global.wachstum,
    redS1: state.scopes.scope1.reduktionsziel/100, redS2: state.scopes.scope2.reduktionsziel/100, redS3: state.scopes.scope3.reduktionsziel/100,
    neutral: state.neutralisierung.prozent/100
  };
}

function calcForYear(year){
  const I = readInputs();
  const p = Math.max(0, Math.min(1, (year-I.baseYear)/Math.max(1, I.targetYear-I.baseYear)));
  const growthFactor = 1 + (I.growthPct/100)*p;
  const bauS1=I.s1*growthFactor, bauS2=I.s2*growthFactor, bauS3=I.s3*growthFactor;
  const bauTotal=bauS1+bauS2+bauS3;
  const redS1Amt=bauS1*I.redS1*p, redS2Amt=bauS2*I.redS2*p, redS3Amt=bauS3*I.redS3*p;
  const restS1=bauS1-redS1Amt, restS2=bauS2-redS2Amt, restS3=bauS3-redS3Amt;
  const opTotal=restS1+restS2+restS3;
  const neutralAmt=opTotal*I.neutral*p;
  const netTotal=opTotal-neutralAmt;
  const nearTarget=I.total*(1-I.nearReductionPct/100);
  const out = {...I,year,p,growthFactor,bauS1,bauS2,bauS3,bauTotal,redS1Amt,redS2Amt,redS3Amt,restS1,restS2,restS3,opTotal,neutralAmt,netTotal,nearTarget};
  /* Finite-Invariante nach der Rechenstufe: ein einziges Infinity/NaN darf nicht in Charts,
     KPIs oder Exporte weiterlaufen (Audit NZ-007). */
  out.finite = ["bauTotal","opTotal","neutralAmt","netTotal","nearTarget"].every(k=> Number.isFinite(out[k]));
  return out;
}
function finalCalc(){ return calcForYear(readInputs().targetYear); }
function nearCalc(){ return calcForYear(readInputs().nearYear); }

/* Nur Massnahmen, die im betrachteten Jahr bereits umgesetzt sind, zaehlen mit. Eine Massnahme
   fuer 2050 darf die Luecke im Zieljahr 2030 nicht schliessen (Audit NZ-005).
   Ohne Argument gilt das Zieljahr - das entspricht dem bisherigen Verhalten fuer den Zieljahr-Blick. */
function measureSums(asOfYear){
  const sums={scope1:0,scope2:0,scope3:0};
  const yr = Number.isFinite(Number(asOfYear)) ? Number(asOfYear) : Number(state.project.zieljahr);
  state.massnahmen.forEach(m=>{
    const jahr = Number(m.jahr);
    if(Number.isFinite(jahr) && jahr > yr) return;   // noch nicht umgesetzt
    const sc = measureScope(m.scope);
    const w = Number(m.wirkung);
    if(sums[sc]!==undefined && Number.isFinite(w)) sums[sc]+=w;
  });
  return sums;
}

/* Deckungsgrad-Zustände. Die Vorversion kodierte "kein Ziel, aber Maßnahmen vorhanden" als
   Zahlenwert 999 und "kein Ziel, keine Maßnahmen" als 100 — beides wanderte als Zahl durch
   Minimum-Bildung, Ampel, Tabellen und Exporte und musste überall per >=999 wieder erkannt werden.
   Jetzt trägt jeder Scope einen expliziten Zustand; ein Prozentwert existiert nur, wenn es
   überhaupt eine Zielreduktion zu decken gibt (product-spec Section 9.2). */
const COV_QUANTIFIED = "quantified";        // Zielreduktion > 0 → Prozentwert aussagekräftig
const COV_NO_TARGET_COVERED = "no-target-covered"; // Ziel = 0, Maßnahmen > 0
const COV_NO_TARGET_IDLE = "no-target-idle";       // Ziel = 0, keine Maßnahmen

function coverage(final){
  const sums = measureSums(final.year);
  const bau = {scope1:final.bauS1, scope2:final.bauS2, scope3:final.bauS3};
  const target = {scope1:final.bauS1*final.redS1, scope2:final.bauS2*final.redS2, scope3:final.bauS3*final.redS3};
  const rest = {scope1:final.restS1, scope2:final.restS2, scope3:final.restS3};
  const out={};
  SCOPE_KEYS.forEach(k=>{
    const tgt=target[k], s=sums[k];
    const covState = tgt>0 ? COV_QUANTIFIED : (s>0 ? COV_NO_TARGET_COVERED : COV_NO_TARGET_IDLE);
    out[k] = {
      sum:s, target:tgt, bau:bau[k], rest:rest[k],
      covState,
      coverage: covState===COV_QUANTIFIED ? (s/tgt*100) : null,
      missing: Math.max(0, tgt-s),
      achieved: bau[k]>0 ? (s/bau[k]*100) : 0
    };
  });
  return out;
}

/* Gesamt-Deckungsgrad = strengster Scope. Scopes ohne Zielreduktion haben keinen Deckungsgrad
   und werden aus dem Minimum ausgenommen, statt es (wie zuvor über 100 bzw. 999) zu verfälschen. */
function overallCoverage(cov){
  const quantified = SCOPE_KEYS.map(k=>cov[k]).filter(c=>c.covState===COV_QUANTIFIED);
  if(quantified.length) return {covState:COV_QUANTIFIED, coverage:Math.min(...quantified.map(c=>c.coverage))};
  const anyMeasures = SCOPE_KEYS.some(k=>cov[k].covState===COV_NO_TARGET_COVERED);
  return {covState: anyMeasures?COV_NO_TARGET_COVERED:COV_NO_TARGET_IDLE, coverage:null};
}

function trafficLight(covPct){
  if(covPct>=100) return "gut";
  if(covPct>=70) return "warnung";
  return "kritisch";
}

/* Ein Scope ohne Zielreduktion hat nichts offen und gilt als "gut" — wie in der Vorversion,
   dort nur implizit über die Zahlenwerte 999/100 erreicht. */
function covTone(c){ return c.covState===COV_QUANTIFIED ? trafficLight(c.coverage) : "gut"; }
function covText(c){
  if(c.covState===COV_QUANTIFIED) return fmtPct(c.coverage);
  return c.covState===COV_NO_TARGET_COVERED ? t("cov_no_target_covered") : t("cov_no_target_idle");
}
function covBarWidth(c){ return c.covState===COV_QUANTIFIED ? Math.min(c.coverage,100) : 100; }
/* Exportzelle: Zahl nur bei quantifizierbarem Ziel, sonst sprechender Text statt Sentinel. */
function covCell(c){ return c.covState===COV_QUANTIFIED ? Math.round(c.coverage) : covText(c); }

/* Ampel-Tönung der Netto-Kachel — gleiche Schwellen wie der Nachweismatrix-Check:
   Netto ≤ 0 = Netto-Null erreicht; ≤ 10 % der Basisemission = nah dran; sonst kritisch. */
function nettoTone(result){
  if(result.nettoGesamt<=0) return "gut";
  if(result.nettoGesamt<=result.final.total*0.1) return "warnung";
  return "kritisch";
}

/* Einziger Einstiegspunkt fuer Kennzahlen. Liefert {valid, errors, warnings, metrics...}.
   Bei blockierenden Fehlern gibt es keine Zahlen - Aufrufer muessen `valid` pruefen (Audit NZ-006/010). */
function buildDashboardResult(){
  const v = validateModel();
  if(!v.valid){
    return {valid:false, errors:v.errors, warnings:v.warnings, rows:[],
            totalBau:null, totalZiel:null, totalMassnahmen:null, nettoGesamt:null,
            overallCov:{covState:COV_NO_TARGET_IDLE, coverage:null}, final:null, near:null};
  }
  const r = buildDashboardMetrics();
  if(!r.final.finite || !r.near.finite){
    return {valid:false, errors:[{field:"model", msg:t("err_nonfinite_stage").replace("{stage}","calcForYear")}],
            warnings:v.warnings, rows:[], totalBau:null, totalZiel:null, totalMassnahmen:null, nettoGesamt:null,
            overallCov:{covState:COV_NO_TARGET_IDLE, coverage:null}, final:null, near:null};
  }
  /* NZ-013: Ueberdeckung ist kein Fehler, aber ein Governance-Hinweis (Doppelzaehlung/Ueberlappung). */
  r.rows.forEach(row=>{
    if(row.cov.covState===COV_QUANTIFIED && row.cov.coverage > 100)
      v.warnings.push(t("warn_coverage_over100").replace("{scope}", t(row.scope)).replace("{pct}", fmtPct(row.cov.coverage)));
  });
  return Object.assign({valid:true, errors:[], warnings:v.warnings}, r);
}

function buildDashboardMetrics(){
  const final = finalCalc();
  const near = nearCalc();
  const cov = coverage(final);
  const rows = SCOPE_KEYS.map(scope=>{
    const c = cov[scope];
    return {
      scope, bau:c.bau, zielreduktion:c.target, massnahmensumme:c.sum,
      cov:c, fehlbetrag:c.missing, erreichungsgrad:c.achieved,
      restemission:c.rest, ampel:covTone(c)
    };
  });
  const overallCov = overallCoverage(cov);
  const totalMassnahmen = rows.reduce((s,r)=>s+r.massnahmensumme,0);
  const totalZiel = final.redS1Amt+final.redS2Amt+final.redS3Amt;
  return {rows, totalBau:final.bauTotal, totalZiel, totalMassnahmen, overallCov, nettoGesamt:final.netTotal, final, near};
}

/* ============================= FORMAT HELPERS ============================= */
/* Number.isFinite statt des globalen isFinite: isFinite(null) ist true und hätte null als "0" gedruckt.
   Ungültige Kennzahlen erscheinen als "–", niemals als NaN/Infinity/0 im DOM (Audit NZ-007). */
function fmtT(v){ return Number.isFinite(v)? Math.round(v).toLocaleString(state.lang==="de"?"de-DE":"en-US") : "–"; }
function fmtPct(v){ return Number.isFinite(v)? v.toLocaleString(state.lang==="de"?"de-DE":"en-US",{maximumFractionDigits:0})+"%" : "–"; }
function fmtNum(v,d=1){ return Number.isFinite(v)? v.toLocaleString(state.lang==="de"?"de-DE":"en-US",{maximumFractionDigits:d}) : "–"; }
function esc(s){ const d=document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }

/* ============================= CHARTS (inline SVG, no external library) =============================
   Reconstructed from reference/IDT_NetZero_Management_Tool_v5.html's drawWaterfall()/drawTrajectory()
   (chart layout and intent were described by analysis, not extracted as verbatim source — the calc
   formulas feeding these charts ARE ported 1:1, see CALC CORE above). */
function drawWaterfallChart(final){
  const total = final.total;
  const cats = [
    {label:"Baseline", value: total, isTotal:true, color:"var(--accent)"},
    {label:"Growth", value: final.bauTotal-total, color:"var(--warning)"},
    {label:t("scope1"), value: -final.redS1Amt, color:"var(--danger)"},
    {label:t("scope2"), value: -final.redS2Amt, color:"var(--danger)"},
    {label:t("scope3"), value: -final.redS3Amt, color:"var(--danger)"},
    {label:"Neutral.", value: -final.neutralAmt, color:"var(--success)"},
    {label:"Net", value: final.netTotal, isTotal:true, color:"var(--success)"}
  ];
  const w=880,h=370,padL=64,padR=16,padT=28,padB=50;
  const innerW=w-padL-padR, innerH=h-padT-padB;
  const xStep = innerW/cats.length;
  let running=0;
  const bars = cats.map((c,i)=>{
    let from,to;
    if(c.isTotal){ from=0; to=c.value; running=c.value; }
    else { from=running; to=running+c.value; running=to; }
    return {...c, i, from:Math.min(from,to), to:Math.max(from,to)};
  });
  const maxV = Math.max(...bars.map(b=>b.to),0), minV = Math.min(...bars.map(b=>b.from),0);
  const range = (maxV-minV)||1;
  const yOf = v=> padT+innerH-((v-minV)/range)*innerH;
  const zeroY = yOf(0);
  const barW = xStep*0.55;

  const gridLines = [0,0.25,0.5,0.75,1].map(f=>{
    const v=minV+range*f, y=yOf(v);
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>
    <text x="${padL-8}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--text-muted)">${fmtT(v)}</text>`;
  }).join("");

  const rects = bars.map((b,i)=>{
    const x = padL+i*xStep+(xStep-barW)/2;
    const yTop = yOf(b.to), yBot = yOf(b.from);
    const hgt = Math.max(Math.abs(yBot-yTop),1);
    return `<rect x="${x.toFixed(1)}" y="${Math.min(yTop,yBot).toFixed(1)}" width="${barW.toFixed(1)}" height="${hgt.toFixed(1)}" fill="${b.color}" opacity=".82"/>
    <text x="${(x+barW/2).toFixed(1)}" y="${(Math.min(yTop,yBot)-6).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--text-muted)">${(!b.isTotal&&b.value>=0?"+":"")}${fmtT(b.value)}</text>
    <text x="${(x+barW/2).toFixed(1)}" y="${h-padB+16}" text-anchor="middle" font-size="10" fill="var(--text-muted)">${b.label}</text>`;
  }).join("");

  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;overflow:visible">
    ${gridLines}
    <line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${w-padR}" y2="${zeroY.toFixed(1)}" stroke="var(--text-muted)" stroke-width="1"/>
    ${rects}
  </svg>`;
}

function drawTrajectoryChart(){
  const I = readInputs();
  const years=[]; for(let y=I.baseYear;y<=I.targetYear;y++) years.push(y);
  const series = years.map(y=>calcForYear(y));
  const w=880,h=390,padL=64,padR=16,padT=28,padB=36;
  const innerW=w-padL-padR, innerH=h-padT-padB;
  const xOf = i=> padL + (years.length>1? i*innerW/(years.length-1) : 0);
  const finalNet = series[series.length-1].netTotal;
  const targetLineVal = y=> I.total + (finalNet-I.total)*((y-I.baseYear)/Math.max(1,I.targetYear-I.baseYear));
  const allVals = series.flatMap(s=>[s.opTotal,s.netTotal]).concat(years.map(targetLineVal),[0]);
  const minV=Math.min(...allVals), maxV=Math.max(...allVals);
  const range=(maxV-minV)||1;
  const yOf = v=> padT+innerH-((v-minV)/range)*innerH;

  const gridLines = [0,0.25,0.5,0.75,1].map(f=>{
    const v=minV+range*f, y=yOf(v);
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>
    <text x="${padL-8}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--text-muted)">${fmtT(v)}</text>`;
  }).join("");

  const targetPath = years.map((y,i)=> (i?"L":"M")+xOf(i).toFixed(1)+","+yOf(targetLineVal(y)).toFixed(1)).join(" ");
  const opPath = series.map((s,i)=> (i?"L":"M")+xOf(i).toFixed(1)+","+yOf(s.opTotal).toFixed(1)).join(" ");
  const netPath = series.map((s,i)=> (i?"L":"M")+xOf(i).toFixed(1)+","+yOf(s.netTotal).toFixed(1)).join(" ");

  const nearIdx = years.indexOf(I.nearYear);
  let marker="";
  if(nearIdx>=0){
    const mx=xOf(nearIdx), my=yOf(I.total*(1-I.nearReductionPct/100));
    marker = `<circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="5" fill="var(--warning)"/>
    <text x="${mx.toFixed(1)}" y="${(my-10).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--warning)" font-weight="700">${t("f_nearjahr")}</text>`;
  }

  const labelStep = Math.max(1, Math.ceil(years.length/12));
  const xLabels = years.map((y,i)=> i%labelStep===0? `<text x="${xOf(i).toFixed(1)}" y="${h-padB+16}" text-anchor="middle" font-size="10" fill="var(--text-muted)">${y}</text>`:"").join("");

  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;overflow:visible">
    ${gridLines}
    <path d="${targetPath}" fill="none" stroke="var(--neutral)" stroke-width="2" stroke-dasharray="5,4"/>
    <path d="${opPath}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
    <path d="${netPath}" fill="none" stroke="var(--success)" stroke-width="2.5"/>
    ${marker}
    ${xLabels}
  </svg>
  <div class="hint" style="margin-top:6px">
    <span style="color:var(--neutral);font-weight:700">┈</span> ${t("chart_target_line")}
    &nbsp;&nbsp;<span style="color:var(--accent);font-weight:700">━</span> ${t("chart_before_neutral")}
    &nbsp;&nbsp;<span style="color:var(--success);font-weight:700">━</span> ${t("kpi_nettogesamt")}
  </div>`;
}

/* ============================= UNIT CONVERSION (Einheitencheck) ============================= */
const UNIT_FACTORS_TO_KG = { kg:1, t:1000, kt:1000000, Mt:1000000000 };
/* V3 (Anwenderwunsch 27.07.): zusaetzlich Energieeinheiten. Bezugsgroesse ist kWh.
   Faktoren: 1 MWh = 1.000 kWh · 1 GJ = 277,7778 kWh (3,6 MJ je kWh) · 1 TJ = 277.777,78 kWh ·
   1 MMBtu = 293,07107 kWh (1 Btu = 1.055,05585262 J, US-Standard). */
const UNIT_FACTORS_TO_KWH = { kWh:1, MWh:1000, GWh:1000000, GJ:1000/3.6, TJ:1000000/3.6, MMBtu:293.07107017222 };
/* Dimension einer Einheit bestimmen — verhindert unsinnige Umrechnungen wie t -> MWh. */
function unitDimension(u){
  if(u in UNIT_FACTORS_TO_KG) return "masse";
  if(u in UNIT_FACTORS_TO_KWH) return "energie";
  return null;
}
function convertUnit(value, from, to){
  const dFrom=unitDimension(from), dTo=unitDimension(to);
  /* Dimensionsmischung wird bewusst NICHT gerechnet: Eine Masse laesst sich ohne Heizwert
     nicht in Energie umrechnen — ein stiller Zahlenwert waere hier fachlich falsch. */
  if(!dFrom || !dTo || dFrom!==dTo) return null;
  const tab = dFrom==="masse" ? UNIT_FACTORS_TO_KG : UNIT_FACTORS_TO_KWH;
  return value*tab[from]/tab[to];
}

/* ============================= VALIDATION ============================= */
/* Feldgrenzen an EINER Stelle. Sie gelten fuer UI, JSON-Import, Share-Link, Autosave und Demo-Daten
   gleichermassen - HTML-min/max allein setzt nichts durch (Audit NZ-006/NZ-010). */
const NZ_LIMITS = {
  basisjahr:      {min:1900, max:2100},
  nearjahr:       {min:1900, max:2100},
  zieljahr:       {min:1900, max:2100},
  nearreduktion:  {min:0,    max:100},
  wachstum:       {min:-100, max:10000},
  basisemission:  {min:0,    max:MAX_FINITE},
  reduktionsziel: {min:0,    max:100},
  neutralisierung:{min:0,    max:100},
  s3value:        {min:0,    max:MAX_FINITE},
  wirkung:        {min:-MAX_FINITE, max:MAX_FINITE},
  massnahmejahr:  {min:1900, max:2100}
};

/* Trennt blockierende Fehler von nicht-blockierenden Hinweisen.
   Blockierend = das Ergebnis waere fachlich sinnlos oder numerisch nicht endlich.
   Solange ein blockierender Fehler besteht, wird keine KPI berechnet, nichts eingefaerbt,
   keine Entscheidung abgeleitet und kein normaler Export erzeugt. */
function validateModel(){
  const errors = [], warnings = [];
  const p = state.project, g = state.global, n = state.neutralisierung;
  const err = (field, msg)=> errors.push({field, msg});

  const range = (val, limKey, field, label)=>{
    const v = Number(val), lim = NZ_LIMITS[limKey];
    if(!Number.isFinite(v)){ err(field, t("err_notfinite").replace("{field}", label)); return false; }
    if(v < lim.min){ err(field, t("err_range").replace("{field}", label).replace("{min}", lim.min).replace("{max}", lim.max)); return false; }
    if(v > lim.max){ err(field, t("err_range").replace("{field}", label).replace("{min}", lim.min).replace("{max}", lim.max)); return false; }
    return true;
  };

  range(p.basisjahr, "basisjahr", "basisjahr", t("f_basisjahr"));
  range(p.zieljahr, "zieljahr", "zieljahr", t("f_zieljahr"));
  range(p.nearjahr, "nearjahr", "nearjahr", t("f_nearjahr"));
  range(p.nearreduktion, "nearreduktion", "nearreduktion", t("f_nearreduktion"));
  /* Ohne echten Zeithorizont ist der ganze Pfad bedeutungslos - das ist ein Fehler, keine Warnung. */
  if(Number(p.zieljahr) <= Number(p.basisjahr)) err("zieljahr", t("err_years"));
  if(Number(p.nearjahr) <= Number(p.basisjahr) || Number(p.nearjahr) >= Number(p.zieljahr)) warnings.push(t("warn_near"));

  range(g.wachstum, "wachstum", "wachstum", t("f_wachstum"));

  ["scope1","scope2"].forEach(k=> range(state.scopes[k].basisemission, "basisemission", k+".basisemission", t(k)+" - "+t("f_basisemission")));
  SCOPE_KEYS.forEach(k=> range(state.scopes[k].reduktionsziel, "reduktionsziel", k+".reduktionsziel", t(k)+" - "+t("f_reduktionsziel")));
  state.s3cats.forEach((c,i)=>{
    const v = Number(c.value);
    if(!Number.isFinite(v) || v < 0) err("s3cat."+(i+1), t("err_negative").replace("{field}", "S3."+(i+1)));
    else if(v > MAX_FINITE) err("s3cat."+(i+1), t("err_toolarge").replace("{field}", "S3."+(i+1)));
  });

  /* Neutralisierung: 0-100 % im Standardmodus. Werte darueber sind Netto-negativ-Aussagen und
     brauchen einen ausdruecklich eingeschalteten Modus mit Begruendung (Audit NZ-008). */
  const np = Number(n.prozent);
  if(!Number.isFinite(np)) err("neutralisierung", t("err_notfinite").replace("{field}", t("f_neutralisierung")));
  else if(np < 0) err("neutralisierung", t("err_neutral_negative"));
  else if(np > 100 && !n.netNegativeMode) err("neutralisierung", t("err_neutral_over100"));
  else if(np > 100 && n.netNegativeMode){
    if((n.netNegativeJust||"").trim().length < 15) err("netNegativeJust", t("err_netneg_just"));
    else warnings.push(t("warn_netneg_active"));
  }

  state.massnahmen.forEach(m=>{
    const w = Number(m.wirkung), j = Number(m.jahr);
    if(!Number.isFinite(w) || Math.abs(w) > MAX_FINITE) err("massnahme", t("err_notfinite").replace("{field}", (m.name||"?")+" - "+t("th_massnahme_wirkung")));
    if(!Number.isFinite(j) || j < NZ_LIMITS.massnahmejahr.min || j > NZ_LIMITS.massnahmejahr.max)
      err("massnahme", t("err_range").replace("{field}", (m.name||"?")+" - "+t("th_massnahme_jahr")).replace("{min}", NZ_LIMITS.massnahmejahr.min).replace("{max}", NZ_LIMITS.massnahmejahr.max));
    if(Number.isFinite(w) && w < 0) warnings.push(t("warn_negative_wirkung").replace("{name}", m.name||"?"));
  });

  if(SCOPE_KEYS.some(k=> qualityOf(k)==="D")) warnings.push(t("warn_quality_d"));
  return {valid: errors.length===0, errors, warnings};
}

/* Rueckwaertskompatibler Aufruf fuer die bestehende Warnbox: liefert reine Textzeilen. */
function validateInputs(){
  const v = validateModel();
  return v.errors.map(e=>e.msg).concat(v.warnings);
}

function renderWarnings(){
  const box = document.getElementById("warnBox");
  if(!box) return;
  const v = validateModel();
  const parts = [];
  if(v.errors.length){
    parts.push(`<strong style="font-size:.85rem;color:var(--danger-text)">\u26d4 ${t("err_blocking_title")}</strong>`
      + `<ul>${v.errors.map(e=>`<li style="color:var(--danger-text)">${esc(e.msg)}</li>`).join("")}</ul>`
      + `<div class="hint">${t("err_blocking_hint")}</div>`);
  }
  if(v.warnings.length){
    parts.push(`<strong style="font-size:.8rem">${t("h_warnings")}</strong><ul>${v.warnings.map(w=>`<li>${esc(w)}</li>`).join("")}</ul>`);
  }
  box.innerHTML = parts.join("");
  box.style.display = parts.length ? "" : "none";
}

const AUTOSAVE_KEY = "idt_netzero_state";
/* Ab dieser URL-Länge warnt der Share-Link. Kein Browser-Hardlimit — der Wert liegt bewusst dort,
   wo E-Mail-Clients und Messenger anfangen, Links umzubrechen oder zu kürzen. */
const SHARE_URL_WARN_LIMIT = 8000;
let autosaveTimer = null;
function setSaveBadge(cls){
  const badge = document.getElementById("saveBadge");
  if(!badge) return;
  badge.className = "save-badge no-print" + (cls==="dirty"? " dirty" : cls==="error"? " error" : "");
  badge.textContent = cls==="dirty"? t("badge_dirty") : cls==="error"? t("badge_error") : t("badge_saved");
  badge.title = cls==="error"? t("badge_error_hint") : t("badge_saved_hint");
}
function scheduleAutosave(){
  setSaveBadge("dirty");
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(()=>{
    /* Schlägt das Speichern fehl (volles oder gesperrtes localStorage, Privatmodus), muss der Nutzer
       das sehen — ein hängengebliebenes "speichert…" liest sich wie ein laufender Vorgang. */
    try{ localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(state)); setSaveBadge("saved"); }
    catch(e){ setSaveBadge("error"); }
  }, 400);
}

/* ============================= NACHWEISMATRIX (Referenz: unitAuditStatus) ============================= */
function auditChecks(){
  const r = buildDashboardResult();
  if(!r.valid) return [{t:t("err_blocking_title"), d:r.errors.map(e=>e.msg).join(" "), ok:false, warn:false}];
  const cov = coverage(r.final);
  /* Ampel-Ton statt Zahlenvergleich: "gut" ⇔ Deckungsgrad ≥ 100 %, "kritisch" ⇔ < 70 % —
     Scopes ohne Zielreduktion haben keinen Prozentwert und blockieren den Check nicht. */
  const covTn = covTone(r.overallCov);
  const qWorst = worstQuality(SCOPE_KEYS.map(qualityOf));
  return [
    {t:t("chk_cov_t"), d:t("chk_cov_d").replace("{s1}",covText(cov.scope1)).replace("{s2}",covText(cov.scope2)).replace("{s3}",covText(cov.scope3)),
     ok:covTn==="gut", warn:covTn!=="kritisch"},
    {t:t("chk_neutral_t"), d:t("chk_neutral_d").replace("{n}",fmtT(r.final.neutralAmt)).replace("{op}",fmtT(r.final.opTotal)),
     ok:r.final.neutralAmt>=0, warn:true},
    {t:t("chk_netzero_t"), d:t("chk_netzero_d").replace("{net}",fmtT(r.final.netTotal)),
     ok:r.final.netTotal<=0, warn:r.final.netTotal<=r.final.total*0.1},
    {t:t("chk_quality_t"), d:t("chk_quality_d").replace("{q1}",t("quality_"+qualityOf("scope1"))).replace("{q2}",t("quality_"+qualityOf("scope2"))).replace("{q3}",t("quality_"+qualityOf("scope3"))),
     ok:QUALITY_RANK[qWorst]>=3, warn:qWorst!=="D"}
  ];
}

/* ============================= SLIDER EFFECT TEXT (Reglerwirkungstext) ============================= */
function renderImpacts(result){
  if(!result.valid || !result.final) return;   // keine Wirkungstexte aus ungueltigen Zahlen
  const final = result.final, near = result.near;
  const cov = coverage(final);
  SCOPE_KEYS.forEach(sk=>{
    const el = document.getElementById("impact_"+sk); if(!el) return;
    const c = cov[sk];
    const menge = fmtT(c.sum)+" "+t("unit_t");
    el.className = "impact hint "+covTone(c);
    // Ohne Zielreduktion gibt es keinen Deckungsgrad — dann trägt der Satz auch keinen Prozentwert.
    el.textContent = c.covState===COV_QUANTIFIED
      ? t("impact_reduce_by").replace("{scope}",t(sk)).replace("{amount}",fmtT(c.target)+" "+t("unit_t"))
        + " " + t("impact_measures_recorded").replace("{amount}",menge).replace("{coverage}",covText(c))
      : t("impact_no_target").replace("{scope}",t(sk))
        + " " + t("impact_measures_no_target").replace("{amount}",menge);
  });
  const growthEl = document.getElementById("impact_wachstum");
  if(growthEl){
    const g = state.global.wachstum;
    const level = g<=5?"gut":g<=20?"warnung":"kritisch";
    growthEl.className = "impact hint "+level;
    growthEl.textContent = t("impact_growth").replace("{pct}",fmtNum(g,1));
  }
  const neutralEl = document.getElementById("impact_neutral");
  if(neutralEl){
    const n = state.neutralisierung.prozent;
    const level = n<=100?"gut":n<=110?"warnung":"kritisch";
    neutralEl.className = "impact hint "+level;
    neutralEl.textContent = t("impact_neutral").replace("{pct}",fmtNum(n,0));
  }
  const nearBox = document.getElementById("nearCheckBox");
  if(nearBox){
    const gap = near.opTotal - near.nearTarget;
    const level = gap<=0 ? "gut" : (gap<=near.total*0.1 ? "warnung" : "kritisch");
    nearBox.className = "hint flag "+level;
    nearBox.textContent = t("impact_near").replace("{year}",state.project.nearjahr)
      .replace("{planned}",fmtT(near.opTotal)+" "+t("unit_t")).replace("{target}",fmtT(near.nearTarget)+" "+t("unit_t"))
      .replace("{gap}",(gap>0?"+":"")+fmtT(gap)+" "+t("unit_t"));
  }
}

}

/* Ersetzt saemtliche Ergebnisdarstellungen, solange blockierende Fehler bestehen.

function blockedResultsHtml(result){
  return `<div class="card blocked-card">
    <h3 style="color:var(--danger-text)">\u26d4 ${t("err_blocking_title")}</h3>
    <ul>${result.errors.map(e=>`<li style="color:var(--danger-text)">${esc(e.msg)}</li>`).join("")}</ul>

}

}

      <div class="hint">${t("flag_"+r.ampel)}</div>

}

function updateRechnerOutputs(){
  const result = buildDashboardResult();
  /* V3-Fix (Review 27.07.2026, Anwenderfund "beim Tippen springt es nach oben"):
     Der Wechsel gueltig <-> ungueltig wurde daran abgelesen, ob #kpiBauVal im DOM steht.
     Beim V2-Umbau sind die Ergebnis-Kacheln aber in andere Reiter gewandert — im Rechner
     existiert das Element nicht mehr (8 von 9 Ergebnis-IDs fehlen dort). Damit war
     zeigtErgebnis IMMER false, result.valid dagegen true, und die Bedingung schlug bei
     JEDEM Tastendruck an: renderMain() baute den ganzen Reiter neu, das Eingabefeld wurde
     ersetzt, Fokus und Scrollposition gingen verloren.
     Jetzt wird der letzte Gueltigkeitszustand gemerkt, statt ihn aus dem DOM zu raten —
     und jede Aktualisierung ist einzeln gegen fehlende Elemente abgesichert (vorher brach
     die Funktion bei fehlendem kpiBau ab, wodurch u. a. der Pfad-Chart nie nachgezogen wurde). */
  if(updateRechnerOutputs._lastValid!==undefined && updateRechnerOutputs._lastValid!==result.valid){
    updateRechnerOutputs._lastValid = result.valid;
    renderMain(); wireActiveTab(); renderWarnings(); updateStickyKpis(); return;
  }
  updateRechnerOutputs._lastValid = result.valid;
  if(!result.valid) return;
  const setTxt=(id,txt)=>{const el=document.getElementById(id); if(el) el.textContent=txt;};
  const setHtml=(id,html)=>{const el=document.getElementById(id); if(el) el.innerHTML=html;};
  setTxt("kpiBauVal", fmtT(result.totalBau)+" "+t("unit_t"));
  setTxt("kpiZielVal", fmtT(result.totalZiel)+" "+t("unit_t"));
  setTxt("kpiMassnahmenVal", fmtT(result.totalMassnahmen)+" "+t("unit_t"));
  setTxt("kpiDeckungsgradVal", covText(result.overallCov));
  setTxt("kpiNettoVal", fmtT(result.nettoGesamt)+" "+t("unit_t"));
  // Ampel-Tönung der bewertbaren Kacheln live nachziehen
  const dgTile = document.getElementById("kpiDeckungsgradTile");
  if(dgTile) dgTile.className = "kpi "+covTone(result.overallCov);
  const nettoTile = document.getElementById("kpiNettoTile");
  if(nettoTile) nettoTile.className = "kpi "+nettoTone(result);
  setHtml("scopeTableBody", renderScopeTableRows(result.rows));
  setHtml("coverageCardsContainer", renderCoverageCards(result.rows));
  setHtml("waterfallChartHost", drawWaterfallChart(result.final));
  setHtml("trajectoryChartHost", drawTrajectoryChart());
  renderImpacts(result);
}

/* ===================== V3-Grafiken (Anwenderwunsch 27.07.) =====================
   Drei Darstellungen, die je EINE Managementfrage beantworten und dafuer nur bereits
   vorhandene Daten nutzen (state.massnahmen, rows aus buildDashboardResult):
     1. nzChartHebelV3   - Welche Massnahme traegt am meisten? (Rangfolge + Anteil am Ziel)
     2. nzChartLueckeV3  - Wo klafft die Luecke? (Deckungsgrad je Scope)
     3. nzChartZeitV3    - Kommt die Wirkung rechtzeitig? (Wirkung je Jahr, kumuliert)
   Gestaltung wie im uebrigen Tool: SVG ohne Fremdbibliothek, Farben aus den CSS-Variablen,
   Einheit immer sichtbar, Leerzustand statt leerer Flaeche. Jede Grafik sagt darunter, was
   man ablesen darf - und was ausdruecklich nicht. */
function nzEscSvgV3(x){return String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function nzLeerV3(txt){return '<div class="empty-hint" style="padding:18px 8px;text-align:center">'+txt+'</div>';}
function nzLeseV3(txt){return '<p class="hint" style="margin-top:8px;line-height:1.45">'+txt+'</p>';}

function nzChartHebelV3(){
  var en=state.lang==="en";
  var res=buildDashboardResult();
  if(!res.valid)return nzLeerV3(en?"Enter base year, target year and scope data first.":"Zuerst Basisjahr, Zieljahr und Scope-Daten eingeben.");
  var ms=(state.massnahmen||[]).filter(function(m){return Number(m.wirkung)>0;});
  if(!ms.length)return nzLeerV3(en?"No measures with an effect recorded yet.":"Noch keine Ma\u00dfnahmen mit Wirkung erfasst.");
  var zielGes=res.rows.reduce(function(a,x){return a+(+x.zielreduktion||0);},0);
  var sorted=ms.slice().sort(function(a,b){return b.wirkung-a.wirkung;});
  var summe=sorted.reduce(function(a,m){return a+ +m.wirkung;},0);
  var w=880,rowH=30,padL=210,padR=92,padT=16,padB=34;
  var h=padT+padB+sorted.length*rowH, innerW=w-padL-padR;
  var max=Math.max.apply(null,sorted.map(function(m){return +m.wirkung;}));
  var farbe={scope1:"var(--danger)",scope2:"var(--warning)",scope3:"var(--accent)"};
  var g='<svg viewBox="0 0 '+w+' '+h+'" width="100%" role="img" aria-label="'+(en?"Contribution per measure":"Beitrag je Ma\u00dfnahme")+'">';
  var kum=0;
  sorted.forEach(function(m,i){
    var y=padT+i*rowH, bw=Math.max(2,(+m.wirkung/max)*innerW);
    kum+=+m.wirkung;
    var antZiel=zielGes>0?(+m.wirkung/zielGes*100):null;
    var kumPct=summe>0?(kum/summe*100):0;
    var name=(m.name||(en?"(unnamed)":"(ohne Namen)")).slice(0,30);
    g+='<text x="'+(padL-10)+'" y="'+(y+18)+'" text-anchor="end" font-size="12" fill="var(--text)">'+nzEscSvgV3(name)+'</text>';
    g+='<rect x="'+padL+'" y="'+(y+5)+'" width="'+bw.toFixed(1)+'" height="'+(rowH-12)+'" rx="3" fill="'+(farbe[m.scope]||"var(--accent)")+'" opacity=".85">'
      +'<title>'+nzEscSvgV3(name)+' \u00b7 '+t(m.scope)+' \u00b7 '+fmtT(+m.wirkung)+' t CO\u2082e'
      +(antZiel!=null?' \u00b7 '+(en?"share of total target":"Anteil am Gesamtziel")+': '+antZiel.toFixed(1)+' %':'')
      +' \u00b7 '+(en?"cumulative":"kumuliert")+': '+kumPct.toFixed(0)+' %</title></rect>';
    g+='<text x="'+(padL+bw+8)+'" y="'+(y+18)+'" font-size="11.5" fill="var(--text-muted)">'+fmtT(+m.wirkung)+' t'
      +(antZiel!=null?' \u00b7 '+antZiel.toFixed(1)+' %':'')+'</text>';
  });
  g+='<text x="'+padL+'" y="'+(h-12)+'" font-size="11" fill="var(--text-muted)">'+(en?"Effect in t CO\u2082e - longest bar = biggest lever":"Wirkung in t CO\u2082e - l\u00e4ngster Balken = gr\u00f6\u00dfter Hebel")+'</text>';
  g+='</svg>';
  var top=sorted[0], topPct=zielGes>0?(+top.wirkung/zielGes*100):null;
  var anteilGes=zielGes>0?(summe/zielGes*100):null;
  var txt=en
    ? 'Measures sorted by effect. The percentage is the share of the <b>total target reduction</b> ('+fmtT(zielGes)+' t). Strongest lever: <b>'+nzEscSvgV3((top.name||"-").slice(0,28))+'</b>'+(topPct!=null?' with '+topPct.toFixed(1)+' %':'')+'. All measures together cover '+(anteilGes!=null?anteilGes.toFixed(1)+' %':'-')+' of the target. Colour marks the scope. What this does not say: whether a measure is cheap, realistic or already decided - it ranks effect only.'
    : 'Ma\u00dfnahmen nach Wirkung sortiert. Der Prozentwert ist der Anteil an der <b>gesamten Zielreduktion</b> ('+fmtT(zielGes)+' t). Gr\u00f6\u00dfter Hebel: <b>'+nzEscSvgV3((top.name||"-").slice(0,28))+'</b>'+(topPct!=null?' mit '+topPct.toFixed(1)+' %':'')+'. Alle Ma\u00dfnahmen zusammen decken '+(anteilGes!=null?anteilGes.toFixed(1)+' %':'-')+' des Ziels. Die Farbe kennzeichnet den Scope. Was die Grafik nicht sagt: ob eine Ma\u00dfnahme g\u00fcnstig, realistisch oder schon beschlossen ist - sie ordnet allein nach Wirkung.';
  return g+nzLeseV3(txt);
}

function nzChartLueckeV3(){
  var en=state.lang==="en";
  var res=buildDashboardResult();
  if(!res.valid)return nzLeerV3(en?"Enter base year, target year and scope data first.":"Zuerst Basisjahr, Zieljahr und Scope-Daten eingeben.");
  var rows=res.rows.filter(function(x){return (+x.zielreduktion||0)>0;});
  // Scopes mit Emissionen, aber ohne Reduktionsziel duerfen nicht stillschweigend verschwinden -
  // sonst sieht eine Bilanz gedeckt aus, in der ein grosser Teil des Fussabdrucks kein Ziel hat.
  var ohneZiel=res.rows.filter(function(x){return (+x.bau||0)>0 && !((+x.zielreduktion||0)>0);});
  if(!rows.length && !ohneZiel.length)return nzLeerV3(en?"No scope has a reduction target yet.":"Noch kein Scope mit Reduktionsziel.");
  var w=880,rowH=54,padL=104,padR=120,padT=14,padB=30;
  var h=padT+padB+(rows.length+ohneZiel.length)*rowH, innerW=w-padL-padR;
  var g='<svg viewBox="0 0 '+w+' '+h+'" width="100%" role="img" aria-label="'+(en?"Coverage per scope":"Deckungsgrad je Scope")+'">';
  rows.forEach(function(r,i){
    var y=padT+i*rowH;
    var ziel=+r.zielreduktion||0, ist=+r.massnahmensumme||0;
    var pct=ziel>0?Math.min(ist/ziel,1):0, echt=ziel>0?ist/ziel*100:0;
    var col=echt>=100?"var(--success)":echt>=50?"var(--warning)":"var(--danger)";
    g+='<text x="'+(padL-12)+'" y="'+(y+26)+'" text-anchor="end" font-size="12.5" fill="var(--text)">'+t(r.scope)+'</text>';
    g+='<rect x="'+padL+'" y="'+(y+8)+'" width="'+innerW+'" height="24" rx="4" fill="var(--text-muted)" opacity=".16"><title>'+(en?"Target":"Ziel")+': '+fmtT(ziel)+' t CO\u2082e</title></rect>';
    g+='<rect x="'+padL+'" y="'+(y+8)+'" width="'+(pct*innerW).toFixed(1)+'" height="24" rx="4" fill="'+col+'" opacity=".9">'
      +'<title>'+t(r.scope)+' \u00b7 '+(en?"measures":"Ma\u00dfnahmen")+' '+fmtT(ist)+' t '+(en?"of":"von")+' '+fmtT(ziel)+' t \u00b7 '+echt.toFixed(1)+' %</title></rect>';
    if(echt<100)g+='<text x="'+(padL+innerW)+'" y="'+(y+45)+'" text-anchor="end" font-size="10.5" fill="var(--text-muted)">'+(en?"gap":"L\u00fccke")+' '+fmtT(ziel-ist)+' t</text>';
    g+='<text x="'+(padL+innerW+10)+'" y="'+(y+26)+'" font-size="13" font-weight="600" fill="'+col+'">'+echt.toFixed(0)+' %</text>';
  });
  ohneZiel.forEach(function(r,i){
    var y=padT+(rows.length+i)*rowH, bau=+r.bau||0;
    g+='<text x="'+(padL-12)+'" y="'+(y+26)+'" text-anchor="end" font-size="12.5" fill="var(--text-muted)">'+t(r.scope)+'</text>';
    g+='<rect x="'+padL+'" y="'+(y+8)+'" width="'+innerW+'" height="24" rx="4" fill="none" stroke="var(--text-muted)" stroke-width="1.2" stroke-dasharray="5 4" opacity=".75">'
      +'<title>'+t(r.scope)+' \u00b7 '+fmtT(bau)+' t CO\u2082e '+(en?"in the balance, no reduction target set":"in der Bilanz, kein Reduktionsziel hinterlegt")+'</title></rect>';
    g+='<text x="'+(padL+innerW/2)+'" y="'+(y+25)+'" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">'+(en?"no target set":"kein Ziel hinterlegt")+' \u00b7 '+fmtT(bau)+' t</text>';
    g+='<text x="'+(padL+innerW+10)+'" y="'+(y+26)+'" font-size="13" font-weight="600" fill="var(--text-muted)">\u2013</text>';
  });
  g+='<text x="'+padL+'" y="'+(h-10)+'" font-size="11" fill="var(--text-muted)">'+(en?"Bar = share of the scope target already covered by measures":"Balken = Anteil des Scope-Ziels, den Ma\u00dfnahmen bereits decken")+'</text>';
  g+='</svg>';
  var luecke=rows.filter(function(r){return (+r.massnahmensumme||0)<(+r.zielreduktion||0);});
  var groesste=luecke.slice().sort(function(a,b){return ((+b.zielreduktion-+b.massnahmensumme)-(+a.zielreduktion-+a.massnahmensumme));})[0];
  var txt=en
    ? 'How much of each scope target the recorded measures already cover. Green from 100 %, amber from 50 %, red below. '+(groesste?'Largest gap: <b>'+t(groesste.scope)+'</b> with '+fmtT((+groesste.zielreduktion)-(+groesste.massnahmensumme))+' t still unaddressed.':'All scope targets are fully covered by measures.')+' A full bar means the arithmetic adds up - not that the measures are implemented.'+(ohneZiel.length?' Dashed row: <b>'+ohneZiel.map(function(x){return t(x.scope);}).join(', ')+'</b> carries '+fmtT(ohneZiel.reduce(function(a,x){return a+(+x.bau||0);},0))+' t in the balance with no reduction target - that volume is not part of any coverage figure above.':'')
    : 'Wie viel des jeweiligen Scope-Ziels die erfassten Ma\u00dfnahmen bereits decken. Gr\u00fcn ab 100 %, gelb ab 50 %, rot darunter. '+(groesste?'Gr\u00f6\u00dfte L\u00fccke: <b>'+t(groesste.scope)+'</b> mit '+fmtT((+groesste.zielreduktion)-(+groesste.massnahmensumme))+' t ohne hinterlegte Ma\u00dfnahme.':'Alle Scope-Ziele sind rechnerisch durch Ma\u00dfnahmen gedeckt.')+' Ein voller Balken hei\u00dft, dass die Rechnung aufgeht - nicht, dass die Ma\u00dfnahmen umgesetzt sind.'+(ohneZiel.length?' Gestrichelte Zeile: <b>'+ohneZiel.map(function(x){return t(x.scope);}).join(', ')+'</b> steht mit '+fmtT(ohneZiel.reduce(function(a,x){return a+(+x.bau||0);},0))+' t in der Bilanz, ohne Reduktionsziel \u2013 diese Menge steckt in keiner der Deckungszahlen oben.':'');
  return g+nzLeseV3(txt);
}

function nzChartZeitV3(){
  var en=state.lang==="en";
  var res=buildDashboardResult();
  if(!res.valid)return nzLeerV3(en?"Enter base year, target year and scope data first.":"Zuerst Basisjahr, Zieljahr und Scope-Daten eingeben.");
  var ms=(state.massnahmen||[]).filter(function(m){return Number(m.wirkung)>0&&Number(m.jahr);});
  if(!ms.length)return nzLeerV3(en?"No measures with an effective year recorded yet.":"Noch keine Ma\u00dfnahmen mit Wirkungsjahr erfasst.");
  var zielJahr=+state.project.zieljahr, basisJahr=+state.project.basisjahr;
  if(!(zielJahr>basisJahr))return nzLeerV3(en?"Target year must be after the base year.":"Das Zieljahr muss nach dem Basisjahr liegen.");
  var jahre=[];for(var y=basisJahr;y<=zielJahr;y++)jahre.push(y);
  var zielGes=res.rows.reduce(function(a,x){return a+(+x.zielreduktion||0);},0);
  var kum=0;
  var punkte=jahre.map(function(yy){
    kum+=ms.filter(function(m){return +m.jahr===yy;}).reduce(function(a,m){return a+ +m.wirkung;},0);
    return {y:yy,kum:kum};
  });
  var maxY=Math.max(zielGes,kum)||1;
  var w=880,h=300,padL=70,padR=20,padT=18,padB=42,innerW=w-padL-padR,innerH=h-padT-padB;
  var X=function(yy){return padL+((yy-basisJahr)/(zielJahr-basisJahr))*innerW;};
  var Y=function(v){return padT+innerH-(v/maxY)*innerH;};
  var g='<svg viewBox="0 0 '+w+' '+h+'" width="100%" role="img" aria-label="'+(en?"Timing of measures":"Zeitliche Wirkung der Ma\u00dfnahmen")+'">';
  [0,.25,.5,.75,1].forEach(function(f){var v=maxY*f,yy=Y(v);
    g+='<line x1="'+padL+'" y1="'+yy+'" x2="'+(w-padR)+'" y2="'+yy+'" stroke="var(--text-muted)" opacity=".18"/>'
      +'<text x="'+(padL-8)+'" y="'+(yy+4)+'" text-anchor="end" font-size="10.5" fill="var(--text-muted)">'+fmtT(v)+'</text>';});
  if(zielGes>0){
    g+='<line x1="'+padL+'" y1="'+Y(zielGes)+'" x2="'+(w-padR)+'" y2="'+Y(zielGes)+'" stroke="var(--success)" stroke-width="1.6" stroke-dasharray="7 5"><title>'+(en?"Total target reduction":"Gesamte Zielreduktion")+': '+fmtT(zielGes)+' t</title></line>';
    g+='<text x="'+(w-padR)+'" y="'+(Y(zielGes)-7)+'" text-anchor="end" font-size="11" fill="var(--success)">'+(en?"target":"Ziel")+' '+fmtT(zielGes)+' t</text>';
  }
  var d=punkte.map(function(p2,i){return (i?"L":"M")+X(p2.y).toFixed(1)+","+Y(p2.kum).toFixed(1);}).join(" ");
  g+='<path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="2.4"/>';
  punkte.forEach(function(p2){
    var neu=ms.filter(function(m){return +m.jahr===p2.y;});
    if(neu.length)g+='<circle cx="'+X(p2.y).toFixed(1)+'" cy="'+Y(p2.kum).toFixed(1)+'" r="4.5" fill="var(--accent)">'
      +'<title>'+p2.y+': '+neu.map(function(m){return nzEscSvgV3((m.name||"-").slice(0,24))+" "+fmtT(+m.wirkung)+" t";}).join(" \u00b7 ")+' \u00b7 '+(en?"cumulative":"kumuliert")+' '+fmtT(p2.kum)+' t</title></circle>';
  });
  jahre.forEach(function(yy,i){
    if(jahre.length<=12||i%Math.ceil(jahre.length/10)===0||yy===zielJahr)
      g+='<text x="'+X(yy).toFixed(1)+'" y="'+(h-16)+'" text-anchor="middle" font-size="10.5" fill="var(--text-muted)">'+yy+'</text>';
  });
  g+='<text x="'+padL+'" y="'+(h-3)+'" font-size="10.5" fill="var(--text-muted)">'+(en?"Cumulative effect of measures in t CO\u2082e":"Kumulierte Ma\u00dfnahmenwirkung in t CO\u2082e")+'</text>';
  g+='</svg>';
  var spaet=ms.filter(function(m){return +m.jahr>=zielJahr;}).reduce(function(a,m){return a+ +m.wirkung;},0);
  var spaetPct=kum>0?spaet/kum*100:0;
  var txt=en
    ? 'When the recorded measures take full effect, added up over the years. The dashed line is the total target reduction - where the curve meets it, the target is arithmetically reached. '+(spaetPct>0?'<b>'+spaetPct.toFixed(0)+' %</b> of the total effect only arrives in the target year '+zielJahr+' itself, which leaves no buffer if something is delayed.':'All measures take effect before the target year.')+' The line shows planned effect, not verified reductions.'
    : 'Wann die erfassten Ma\u00dfnahmen voll wirken, \u00fcber die Jahre aufsummiert. Die gestrichelte Linie ist die gesamte Zielreduktion - wo die Kurve sie trifft, ist das Ziel rechnerisch erreicht. '+(spaetPct>0?'<b>'+spaetPct.toFixed(0)+' %</b> der Gesamtwirkung fallen erst im Zieljahr '+zielJahr+' selbst an; verz\u00f6gert sich dort etwas, fehlt jeder Puffer.':'Alle Ma\u00dfnahmen wirken vor dem Zieljahr.')+' Die Linie zeigt geplante Wirkung, keine nachgewiesene Reduktion.';
  return g+nzLeseV3(txt);
}


/* ============ V3: Referenzpfade + Beispielfall XY (Anwenderwunsch 27.07.) ============
   Quellen der Zielwerte:
     SBTi 1,5 C  - lineare absolute Reduktion 4,2 %-Punkte der Basis pro Jahr
                   (SBTi Corporate Net-Zero Standard)
     SBTi WB2 C  - 2,5 %-Punkte pro Jahr
     EU Fit for 55 - 55 % bis 2030 gegenueber 1990 (VO (EU) 2021/1119), 40 Jahre
                   -> 1,375 %-Punkte pro Jahr linear
     IPCC 1,5 C  - 45 % bis 2030 gegenueber 2010 (SR1.5), 20 Jahre
                   -> 2,25 %-Punkte pro Jahr linear
   WICHTIG und in der Lesehilfe ausdruecklich gesagt: EU- und IPCC-Ziele sind
   volkswirtschaftliche bzw. globale Ziele mit eigenem Basisjahr (1990 bzw. 2010).
   Sie werden hier auf das Basisjahr des Projekts normiert und dienen der EINORDNUNG,
   nicht als Unternehmensziel. Netto-Null-Marken kommen aus dem Rechtsrahmen:
   Deutschland 2045 (KSG Sec.3 Abs.2), EU 2050 (VO 2021/1119), IEA Net-Zero 2050. */
var NZ_PFADE_V3=[
 {id:"sbti15", kurz:"SBTi 1,5 \u00b0C",      rate:4.2,   farbe:"var(--success)", dash:"",      quelle:"SBTi Corporate Net-Zero Standard: −4,2 %-Punkte p. a. (linear, absolut)"},
 {id:"ipcc15", kurz:"IPCC 1,5 \u00b0C",      rate:2.25,  farbe:"var(--accent)",  dash:"6 4",   quelle:"IPCC SR1.5: \u221245 % bis 2030 ggü. 2010"},
 {id:"sbti2",  kurz:"SBTi < 2 \u00b0C",      rate:2.5,   farbe:"var(--warning)", dash:"2 3",   quelle:"SBTi, deutlich unter 2 \u00b0C: \u22122,5 %-Punkte p. a."},

];
var NZ_NETTONULL_V3=[{jahr:2045,txt:"DE KSG"},{jahr:2050,txt:"EU / IEA"}];

function nzChartPfadeV3(){
  var en=state.lang==="en";
  var res=buildDashboardResult();
  if(!res.valid)return nzLeerV3(en?"Enter base year, target year and scope data first.":"Zuerst Basisjahr, Zieljahr und Scope-Daten eingeben.");
  var basisJ=+state.project.basisjahr, zielJ=+state.project.zieljahr;
  if(!(zielJ>basisJ))return nzLeerV3(en?"Target year must be after the base year.":"Das Zieljahr muss nach dem Basisjahr liegen.");
  var basisE=res.rows.reduce(function(a,x){return a+(+x.bau||0);},0);
  var startE=(res.final&&res.final.total)||basisE;
  if(!(startE>0))return nzLeerV3(en?"No baseline emissions recorded.":"Keine Basisemissionen erfasst.");
  var endeJ=Math.max(zielJ,2050);
  var jahre=[];for(var y=basisJ;y<=endeJ;y++)jahre.push(y);
  var w=880,h=360,padL=68,padR=118,padT=22,padB=44,innerW=w-padL-padR,innerH=h-padT-padB;
  var X=function(yy){return padL+((yy-basisJ)/(endeJ-basisJ))*innerW;};
  var Y=function(v){return padT+innerH-(Math.max(0,v)/startE)*innerH;};
  var g='<svg viewBox="0 0 '+w+' '+h+'" width="100%" role="img" aria-label="'+(en?"Reduction pathways in comparison":"Reduktionspfade im Vergleich")+'">';
  [0,.25,.5,.75,1].forEach(function(f){var v=startE*f,yy=Y(v);
    g+='<line x1="'+padL+'" y1="'+yy.toFixed(1)+'" x2="'+(w-padR)+'" y2="'+yy.toFixed(1)+'" stroke="var(--text-muted)" opacity=".16"/>'
      +'<text x="'+(padL-8)+'" y="'+(yy+4).toFixed(1)+'" text-anchor="end" font-size="10.5" fill="var(--text-muted)">'+fmtT(v)+'</text>';});
  // Referenzpfade
  NZ_PFADE_V3.forEach(function(pf){
    var d=jahre.map(function(yy,i){var v=Math.max(0,startE*(1-pf.rate/100*(yy-basisJ)));return (i?"L":"M")+X(yy).toFixed(1)+","+Y(v).toFixed(1);}).join(" ");
    g+='<path d="'+d+'" fill="none" stroke="'+pf.farbe+'" stroke-width="1.7" opacity=".85"'+(pf.dash?' stroke-dasharray="'+pf.dash+'"':'')+'>'
      +'<title>'+pf.kurz+' \u00b7 \u2212'+String(pf.rate).replace(".",",")+' %-'+(en?"points p.a.":"Punkte p. a.")+' \u00b7 '+pf.quelle+'</title></path>';
    var nullJahr=basisJ+Math.ceil(100/pf.rate);
    var endY=Y(Math.max(0,startE*(1-pf.rate/100*(endeJ-basisJ))));
    g+='<text x="'+(w-padR+6)+'" y="'+(endY+4).toFixed(1)+'" font-size="10.5" fill="'+pf.farbe+'">'+pf.kurz+'</text>';
  });
  // eigene Planlinie: Basis -> Netto-Rest im Zieljahr
  var restZiel=(res.final&&res.final.netTotal!=null)?res.final.netTotal:startE;
  var dPlan="M"+X(basisJ).toFixed(1)+","+Y(startE).toFixed(1)+" L"+X(zielJ).toFixed(1)+","+Y(restZiel).toFixed(1);
  g+='<path d="'+dPlan+'" fill="none" stroke="var(--danger)" stroke-width="3">'
    +'<title>'+(en?"Own plan":"Eigener Plan")+': '+fmtT(startE)+' t \u2192 '+fmtT(restZiel)+' t ('+basisJ+'\u2013'+zielJ+')</title></path>';
  g+='<circle cx="'+X(zielJ).toFixed(1)+'" cy="'+Y(restZiel).toFixed(1)+'" r="5" fill="var(--danger)"/>';
  g+='<text x="'+(X(zielJ)).toFixed(1)+'" y="'+(Y(restZiel)-11).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--danger)">'+(en?"own plan":"eigener Plan")+' '+zielJ+'</text>';
  // Netto-Null-Marken
  NZ_NETTONULL_V3.forEach(function(m){
    if(m.jahr<basisJ||m.jahr>endeJ)return;
    g+='<line x1="'+X(m.jahr).toFixed(1)+'" y1="'+padT+'" x2="'+X(m.jahr).toFixed(1)+'" y2="'+(padT+innerH)+'" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="2 5" opacity=".55"><title>'+(en?"Net zero":"Netto-Null")+' '+m.txt+': '+m.jahr+'</title></line>'
      +'<text x="'+X(m.jahr).toFixed(1)+'" y="'+(padT-7)+'" text-anchor="middle" font-size="9.5" fill="var(--text-muted)">'+m.txt+' '+m.jahr+'</text>';
  });
  jahre.forEach(function(yy,i){
    if(yy%5===0||yy===basisJ||yy===zielJ)
      g+='<text x="'+X(yy).toFixed(1)+'" y="'+(h-22)+'" text-anchor="middle" font-size="10" fill="var(--text-muted)">'+yy+'</text>';});
  g+='<text x="'+padL+'" y="'+(h-6)+'" font-size="10.5" fill="var(--text-muted)">'+(en?"Emissions in t CO\u2082e - all pathways normalised to the base year":"Emissionen in t CO\u2082e - alle Pfade auf das Basisjahr normiert")+'</text>';
  g+='</svg>';
  // Einordnung: eigene Rate gegen SBTi
  var jahreBis=zielJ-basisJ;
  var eigeneRate=jahreBis>0&&startE>0?((startE-restZiel)/startE*100/jahreBis):0;
  var sbtiWert=Math.max(0,startE*(1-4.2/100*jahreBis));
  var strenger=restZiel<sbtiWert;
  var txt=en
    ? 'Your plan (red) against science-based and regulatory pathways, all normalised to your base year '+basisJ+'. Your line falls by about <b>'+eigeneRate.toFixed(1)+' percentage points per year</b>; SBTi 1.5 &deg;C requires 4.2. In '+zielJ+' your plan reaches '+fmtT(restZiel)+' t, the SBTi path '+fmtT(sbtiWert)+' t &mdash; your plan is therefore <b>'+(strenger?'more ambitious':'less ambitious')+'</b> than SBTi 1.5 &deg;C. Dotted verticals mark the legal net-zero dates. <b>Read with care:</b> EU Fit for 55 (base 1990) and IPCC 1.5 &deg;C (base 2010) are economy-wide and global targets with their own base years; they are shown for orientation, not as company targets. A company in a growing site may need a steeper path than the average.'
    : 'Ihr Plan (rot) gegen wissenschaftsbasierte und regulatorische Pfade, alle auf Ihr Basisjahr '+basisJ+' normiert. Ihre Linie f\u00e4llt um rund <b>'+eigeneRate.toFixed(1).replace(".",",")+' Prozentpunkte pro Jahr</b>; SBTi 1,5 &deg;C verlangt 4,2. Im Jahr '+zielJ+' erreicht Ihr Plan '+fmtT(restZiel)+' t, der SBTi-Pfad '+fmtT(sbtiWert)+' t &mdash; Ihr Plan ist damit <b>'+(strenger?'ambitionierter':'weniger ambitioniert')+'</b> als SBTi 1,5 &deg;C. Die gepunkteten Senkrechten markieren die gesetzlichen Netto-Null-Termine. <b>Vorsicht beim Lesen:</b> EU Fit for 55 (Basis 1990) und IPCC 1,5 &deg;C (Basis 2010) sind volkswirtschaftliche bzw. globale Ziele mit eigenem Basisjahr; sie stehen hier zur Einordnung, nicht als Unternehmensziel. Ein Unternehmen an einem wachsenden Standort braucht unter Umst\u00e4nden einen steileren Pfad als der Durchschnitt.';
  var quellenZeile='<div class="hint" style="margin-top:6px;font-size:11.5px">'+(en?'Sources: ':'Quellen: ')+NZ_PFADE_V3.map(function(x){return x.kurz+' \u2013 '+x.quelle;}).join(' \u00b7 ')+' \u00b7 '+(en?'Net-zero dates: Germany KSG Sec. 3 (2), EU Regulation 2021/1119, IEA Net Zero Roadmap.':'Netto-Null-Termine: Deutschland KSG \u00a7 3 Abs. 2, VO (EU) 2021/1119, IEA Net-Zero-Roadmap.')+'</div>';
  return g+nzLeseV3(txt)+quellenZeile;
}

    {id:5,de:"Windkraft \u2192 Power-to-Heat",               en:"Wind power \u2192 power-to-heat",           scope:"scope1",wirkung:3416,jahr:2032},
    {id:6,de:"PV \u2192 Power-to-Heat",                      en:"PV \u2192 power-to-heat",                   scope:"scope1",wirkung:1993,jahr:2032},
    {id:7,de:"Flottenelektrifizierung",                   en:"Fleet electrification",                  scope:"scope1",wirkung:80,  jahr:2035},
    {id:8,de:"Notstrom \u2192 HVO / Batterie",               en:"Back-up power \u2192 HVO / battery",        scope:"scope1",wirkung:50,  jahr:2035},
    {id:9,de:"Spitzenlastkessel \u2192 E-Kessel",            en:"Peak-load boiler \u2192 electric boiler",   scope:"scope1",wirkung:1500,jahr:2038}
  ].map(function(m){ return {id:m.id,name:en?m.en:m.de,scope:m.scope,wirkung:m.wirkung,jahr:m.jahr}; });
  state.nextMassnahmeId=10;
  state.neutralisierung.prozent=0;   // Quelle: keine Kompensation zur Zielerreichung

    ? "Source: reduction only, no compensation used to reach the target (optional on top)."

  state.audit=state.audit||[];

    author:en?"Sample case XY":"Beispielfall XY",
    note:en
      ? "Sample case XY: anonymised real data of an industrial energy-services site, taken from its sustainability report and net-zero plan. Scope 1/2 are measured actuals for the base year (7,580 / 2,411 t); Scope 3 is the conservative estimate from the same report (5,600 t). The site uses an earlier methodological base year - the full figures for it are not documented, so the reporting year is used as the base here. Measure effects from the roadmap. Limitations: (a) Scope 3 exists only as an aggregate estimate - with no category breakdown available it is booked entirely to category 1, quality C; (b) the Net Zero 2040 target and the -40 % by 2030 milestone apply to Scope 1+2 only - Scope 3 therefore carries a 0 % reduction target and deliberately shows up as an open remainder in the gap chart."
      : "Beispielfall XY: anonymisierte Realdaten eines industriellen Energiedienstleistungsstandorts aus dessen Nachhaltigkeitsbericht und NetZero-Plan. Scope 1/2 sind gemessene Ist-Werte des Basisjahrs (7.580 / 2.411 t); Scope 3 ist die konservative Sch\u00e4tzung desselben Berichts (5.600 t). Der Standort nutzt methodisch ein fr\u00fcheres Basisjahr \u2013 dessen vollst\u00e4ndige Werte sind nicht dokumentiert, daher hier das Berichtsjahr als Basis. Ma\u00dfnahmenwirkungen aus der Roadmap. Einschr\u00e4nkungen: (a) Scope 3 liegt nur als Gesamtsch\u00e4tzung vor \u2013 mangels Kategorie-Aufteilung vollst\u00e4ndig in Kategorie 1 gebucht, Qualit\u00e4t C; (b) das Ziel Net-Zero 2040 und das Zwischenziel \u201340 % bis 2030 gelten nur f\u00fcr Scope 1+2 \u2013 Scope 3 steht daher mit Reduktionsziel 0 % in der Bilanz und erscheint in der L\u00fccken-Grafik bewusst als offener Rest."});
  renderAll(); scheduleAutosave();
  alert(en?"Sample case XY loaded. See Audit trail for the data origin.":"Beispielfall XY geladen. Die Datenherkunft steht im Audit-Trail.");
}

/* ===== V3: Echter Management-Bericht fuer Druck/PDF =====
   Vorher rief der Druck-Knopf nur window.print() auf - gedruckt wurde also die gerade
   sichtbare Ansicht (in der Praxis der Export-Tab), nicht der Bericht (Anwender-Fund).
   Jetzt wird - wie buildReportV51 im Umwelt-Dashboard - ein eigener Container #report-print
   aufgebaut: Deckkopf, Kennzahlen, beide Grafiken, Scope-Tabelle, Massnahmen, Neutralisierung.
   Das Print-CSS blendet alles ausser diesem Container aus, dadurch ist das Ergebnis unabhaengig
   davon, welcher Reiter offen war. ===== */
function nzBuildReportV3(){
  const p=state.project, r=buildDashboardResult(), en=state.lang==="en";
  const dateStr=new Date().toLocaleDateString(en?"en-US":"de-DE");
  let out=`<div class="rep-head-v3">
    <h1>${t("rep_title")}</h1>
    <div class="rep-meta-v3">${esc(p.name||"")} · ${t("f_basisjahr")} ${p.basisjahr} · ${t("f_nearjahr")} ${p.nearjahr} · ${t("f_zieljahr")} ${p.zieljahr}
      ${p.verantwortlich?" · "+t("f_verantwortlich")+": "+esc(p.verantwortlich):""}</div>
    <div class="rep-meta-v3">${t("rep_created")} ${dateStr}</div>
  </div>`;
  if(!r.valid){
    out+=`<div class="rep-block-v3"><h2>${t("rep_blocked_h")}</h2><p>${t("rep_blocked_p")}</p></div>`;
    return out;
  }
  /* 1) Kennzahlen */
  out+=`<div class="rep-block-v3"><h2>${t("h_kpis")}</h2><table class="rep-kpi-v3"><tbody>
    <tr><td>${t("kpi_bau")}</td><td>${fmtT(r.totalBau)} ${t("unit_t")}</td></tr>
    <tr><td>${t("kpi_zielreduktion")}</td><td>${fmtT(r.totalZiel)} ${t("unit_t")}</td></tr>
    <tr><td>${t("kpi_massnahmen")}</td><td>${fmtT(r.totalMassnahmen)} ${t("unit_t")}</td></tr>
    <tr><td>${t("kpi_deckungsgrad")}</td><td>${covText(r.overallCov)}</td></tr>
    <tr><td>${t("kpi_nettogesamt")}</td><td>${fmtT(r.nettoGesamt)} ${t("unit_t")}</td></tr>
  </tbody></table></div>`;
  /* 2) Grafiken */
  out+=`<div class="rep-block-v3"><h2>${t("h_waterfallchart")}</h2>${drawWaterfallChart(r.final)}</div>`;
  out+=`<div class="rep-block-v3 rep-break-v3"><h2>${t("h_trajectorychart")}</h2>${drawTrajectoryChart()}</div>`;
  /* 3) Scope-Tabelle */
  out+=`<div class="rep-block-v3"><h2>${t("h_scopetable")}</h2>
    <table><thead><tr><th>${t("th_scope")}</th><th>${t("th_bau")}</th><th>${t("th_zielreduktion")}</th>
    <th>${t("th_massnahmensumme")}</th><th>${t("th_deckungsgrad")}</th><th>${t("th_fehlbetrag")}</th>
    <th>${t("th_erreichungsgrad")}</th><th>${t("th_restemission")}</th></tr></thead>
    <tbody>${renderScopeTableRows(r.rows)}</tbody></table></div>`;
  /* 4) Massnahmen */
  if(state.massnahmen.length){
    out+=`<div class="rep-block-v3"><h2>${t("h_massnahmen")}</h2>
      <table><thead><tr><th>${t("th_massnahme_name")}</th><th>${t("th_massnahme_scope")}</th>
      <th>${t("th_massnahme_wirkung")}</th><th>${t("th_massnahme_jahr")}</th></tr></thead><tbody>
      ${state.massnahmen.map(m=>`<tr><td style="text-align:left">${esc(m.name||"")}</td><td>${t(m.scope)||m.scope}</td>
        <td>${fmtT(m.wirkung)}</td><td>${m.jahr}</td></tr>`).join("")}
      </tbody></table></div>`;
  }
  /* 5) Neutralisierung */
  {const n=state.neutralisierung;
   out+=`<div class="rep-block-v3"><h2>${t("h_neutralisierung")}</h2>
     <table class="rep-kpi-v3"><tbody>
       <tr><td>${t("f_neutralisierung_desc")}</td><td>${esc(n.beschreibung||"–")}</td></tr>
       <tr><td>${t("f_netnegmode")}</td><td>${n.netNegativeMode?t("yes"):t("no")}</td></tr>
     </tbody></table></div>`;}
  out+=`<div class="rep-foot-v3">${t("rep_foot")}</div>`;
  return out;
}

   Reglers unmittelbar, wie sich die Bruecke veraendert; der ausfuehrliche Rechner bleibt
   unveraendert fuer die eigentliche Dateneingabe. Es werden dieselben Zustandsfelder und
   dieselbe Berechnung genutzt - kein zweiter Datenpfad. ===== */
/* V3-Fix (Review 27.07.2026, Anwenderfund "Slider reagieren nicht"): Der Ergebnisbereich
   (KPIs + Wasserfall) steckte fest im Tab-Markup. Die Reglerverdrahtung lag ausserdem nur im
   Zweig tab==="rechner" — im Simulator hatten die Regler daher gar keine Handler.
   Der Ergebnisbereich ist jetzt eine eigene Funktion, damit beim Ziehen NUR er neu gezeichnet
   wird: wuerde der ganze Tab neu rendern, verlaere der Regler den Fokus und das Ziehen bricht ab. */
/* V4 (Anwenderwunsch 28.07.): Simple/Expert im Simulator. Simple zeigt weiterhin nur die
   Emissions-Bruecke - eine Groesse, eine Aussage, gut zum Schieben. Expert stellt dieselbe
   Bruecke als erste Kachel in ein Raster mit den fuenf Managementgrafiken, damit beim Ziehen
   der Regler sofort sichtbar wird, was die Aenderung an Hebeln, Luecke, Zeitpunkt und
   Pfadvergleich bewirkt. Die Grafiken sind dieselben Funktionen wie in Big Picture - keine
   zweite Rechen- oder Zeichenlogik. */

  if(state.simMode!=="simple"&&state.simMode!=="expert")state.simMode="simple";

}

function openPrint(title, html){
  const w = window.open("", "_blank");
  if(!w){ alert(t("rp_popupblocked")); return; }
  w.document.write(`<!DOCTYPE html><html lang="${state.lang}"><head><meta charset="UTF-8"><title>${esc(title)}</title>
  <style>${printCss()}</style></head><body>
  <div class="printbar"><span style="font-weight:700">${esc(title)}</span>
  <button onclick="window.print()">${t("rp_print")}</button><span class="hint">${t("rp_printhint")}</span></div>
  ${html}</body></html>`);
  w.document.close();
  w.focus();
}

function co2WireImpact(){
  const ci = state.co2impact;
  const num = (id, apply)=>{ const el=document.getElementById(id); if(el) el.addEventListener("input",()=>apply(el.value)); };
  const val = document.getElementById("ci_value");
  if(val) val.addEventListener("input",()=>{ if(ci.useManual){ ci.manualInput=Number(val.value)||0; renderMain(); } });
  const um = document.getElementById("ci_useManual");
  if(um) um.onchange=()=>{ ci.useManual=um.checked; if(ci.useManual && !ci.manualInput) ci.manualInput=Math.round(co2AutoValue()*100)/100; renderMain(); };
  num("ci_period", v=>{ const n=Math.round(Number(v)); ci.period = (Number.isFinite(n)&&n>=1)?n:1; });
  const basisEl = document.getElementById("ci_basis");
  if(basisEl) basisEl.onchange = ()=>{ ci.basis = basisEl.value==="cumulative"?"cumulative":"annual"; renderMain(); wireActiveTab(); scheduleAutosave(); };
  const proj = document.getElementById("ci_project");
  if(proj) proj.addEventListener("input",()=>{ ci.projectName=proj.value; });
  const mode = document.getElementById("ci_mode");
  if(mode) mode.onchange=()=>{ ci.mode=mode.value; };
  const veh = document.getElementById("ci_vehicle");
  if(veh) veh.onchange=()=>{ ci.vehicleClass=veh.value; ci.vehicleGco2=CO2_VEHICLE_CLASSES[veh.value]; renderMain(); };
  num("ci_gco2", v=>{ ci.vehicleGco2=Number(v)||0; renderMain(); });
  const sp = document.getElementById("ci_species");
  if(sp) sp.onchange=()=>{ ci.forestSpecies=sp.value; ci.forestIncrement=CO2_FOREST_SPECIES[sp.value]; renderMain(); };
  num("ci_increment", v=>{ ci.forestIncrement=Number(v)||0; renderMain(); });
  const b=(id,fn)=>{ const el=document.getElementById(id); if(el) el.onclick=fn; };
  b("ciExpJson", co2ExportJson); b("ciExpCsv", co2ExportCsv); b("ciExpMd", co2ExportMd);
}
function co2WireAudit(){
  document.querySelectorAll("[data-co2ov]").forEach(inp=>{
    inp.addEventListener("input",()=>{ const id=inp.dataset.co2ov; const v=inp.value.trim();
      if(v==="") delete state.co2impact.overrides[id]; else state.co2impact.overrides[id]=Number(v);
      scheduleAutosave(); });

  if(reset) reset.onclick=()=>{ state.co2impact.overrides={}; renderMain(); scheduleAutosave(); };

  b("regExpCsv", co2RegistryCsv); b("regExpJson", co2RegistryJson); b("regExpMd", co2AuditMd);

  b("s4RegCsv", s4RegistryCsv); b("s4RegJson", s4RegistryJson); b("s4AuditMd", s4AuditMd);

function s4Wire(){
  const a = state.scope4.active;
  document.querySelectorAll("[data-s4i]").forEach(el=>{
    el.addEventListener("input",()=>{ a.inputs[el.dataset.s4i]=Number(el.value)||0; });
    el.addEventListener("change",()=> renderMain());
  });
  document.querySelectorAll("[data-s4f]").forEach(el=>{
    const key = el.dataset.s4f;
    if(el.tagName==="SELECT"){ el.onchange=()=>{ a[key]=el.value; renderMain(); }; }
    else if(el.type==="number"){ el.addEventListener("input",()=>{ a[key]=Number(el.value)||0; }); el.addEventListener("change",()=> renderMain()); }
    else { el.addEventListener("input",()=>{ a[key]=el.value; }); }
  });
  document.querySelectorAll("[data-s4claim]").forEach(cb=> cb.onchange=()=>{ a.claims[cb.dataset.s4claim]=cb.checked; renderMain(); });
  document.querySelectorAll("[data-s4qual]").forEach(cb=> cb.onchange=()=>{ a.quality[cb.dataset.s4qual]=cb.checked; renderMain(); });
  const b=(id,fn)=>{ const el=document.getElementById(id); if(el) el.onclick=fn; };
  b("s4Save",()=>{ const snap=structuredClone(a); snap.id=state.scope4.nextId++;
    snap.date=new Date().toISOString().slice(0,16).replace("T"," "); if(!snap.name) snap.name="S4-"+snap.id;
    state.scope4.projects.push(snap); renderMain(); scheduleAutosave(); });
  b("s4New",()=>{ state.scope4.active = structuredClone(defaultState().scope4.active); renderMain(); });
  document.querySelectorAll("[data-s4load]").forEach(btn=> btn.onclick=()=>{ const p=state.scope4.projects.find(x=>x.id===Number(btn.dataset.s4load)); if(p){ state.scope4.active=structuredClone(p); renderMain(); } });
  document.querySelectorAll("[data-s4del]").forEach(btn=> btn.onclick=()=>{ state.scope4.projects=state.scope4.projects.filter(x=>x.id!==Number(btn.dataset.s4del)); renderMain(); scheduleAutosave(); });
  b("s4ExpJson",s4ExportJson); b("s4ExpCsv",s4ExportCsv); b("s4ExpMd",s4AuditMd); b("s4ExpMgmt",s4ManagementMd);
}

    let simTimer=null;

       dem V2-Umbau die Quellen-/Faktoransicht (tabAuditQuellenInnerV2). Deren Verdrahtung
       (Override-Felder, Reset, Registry-Exporte) lief aber nur unter dem alten Tab-Namen
       "auditquellen" und wurde hier NIE aufgerufen — die Felder waren tot. Zusätzlich griff
       der alte Formular-Code auf nicht mehr vorhandene Elemente zu (TypeError bei jedem

    wireAuditFormV3();

  if(tab==="einheitencheck"){
    const recalc=()=>{
      const val = Number(document.getElementById("uc_value").value);

    };
    ["uc_value","uc_from","uc_to"].forEach(id=> document.getElementById(id).addEventListener("input",recalc));
    recalc();

    if(cq) cq.addEventListener("input",()=>{ document.getElementById("cq_results").innerHTML = co2QuickRows(cq.value); });

  /* V3 (Review 27.07.2026): Hier stand die Verdrahtung fuer den Reiter "managementexport".
     Den gibt es seit dem V2-Umbau nicht mehr — die sechs Knopf-IDs (expJson, expImport, expA4,
     expPdf, expExcel, expMassCsv) existieren in keinem Reiter, der Zweig lief also nie.
     Alle Funktionen sind im Reiter "Export/Import" abgedeckt: xExportJson, xImportJson,
     xPrint (A4/Druck), xExcel6, xImportCsv. Toter Code entfernt — die ungeschuetzten
     Zugriffe darin waeren bei einer Reaktivierung des Namens sofort abgestuerzt. */
}

/* ============================= EXPORT HELPERS ============================= */
function downloadFile(filename, content, mime){
  const blob = new Blob([content],{type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}
function csvEscape(v){
  const s = String(v??"");
  return /[;"\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function downloadJson(){
  downloadFile((state.project.name||"netzero")+"_state.json", JSON.stringify(state,null,2), "application/json");
}

/* ============================= EXCEL-EXPORT (SpreadsheetML) =============================
   Mehrblättrige Excel-Arbeitsmappe ohne externe Bibliothek (wie Schwestertool):
   von Excel/LibreOffice nativ geöffnet; verlustfreier Voll-Roundtrip weiterhin über JSON. */
function xmlEsc(s){
  return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function xlsCell(v){
  if(typeof v==="number" && isFinite(v)) return `<Cell><Data ss:Type="Number">${v}</Data></Cell>`;
  return `<Cell><Data ss:Type="String">${xmlEsc(v)}</Data></Cell>`;
}
function xlsSheet(name, rows){
  const safe = String(name).replace(/[\[\]:*?\/\\]/g,"-").slice(0,31);
  return `<Worksheet ss:Name="${xmlEsc(safe)}"><Table>`+
    rows.map(r=>`<Row>${r.map(xlsCell).join("")}</Row>`).join("")+
    `</Table></Worksheet>`;
}
function xlsWorkbook(sheets){
  return `<?xml version="1.0" encoding="UTF-8"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
${sheets.join("\n")}
</Workbook>`;
}

function buildExcelExport(){
  const r = buildDashboardResult();
  const p = state.project;

  const projekt = [
    [t("h_projekt"), ""],
    [t("f_name"), p.name], [t("f_basisjahr"), Number(p.basisjahr)||0],
    [t("f_nearjahr"), Number(p.nearjahr)||0], [t("f_zieljahr"), Number(p.zieljahr)||0],
    [t("f_verantwortlich"), p.verantwortlich],
    [t("f_nearreduktion")+" (%)", Number(p.nearreduktion)||0],
    [t("f_wachstum"), Number(state.global.wachstum)||0],
    [t("f_neutralisierung")+" (%)", Number(state.neutralisierung.prozent)||0],
    [t("f_neutralisierung_desc"), state.neutralisierung.beschreibung]
  ];

  const scopes = [[t("th_scope"), t("f_basisemission"), t("f_reduktionsziel")+" (%)", t("f_qualityscope")]]
    .concat(SCOPE_KEYS.map(k=>[t(k),
      k==="scope3"? s3Sum() : Number(state.scopes[k].basisemission)||0,
      Number(state.scopes[k].reduktionsziel)||0,
      t("quality_"+qualityOf(k))]));

  const s3 = [["#", t("th_name"), t("f_basisemission"), t("f_qualityscope")]]
    .concat(state.s3cats.map(c=>[c.no, t("s3cat_"+c.no), Number(c.value)||0, c.quality]));

  const massnahmen = [[t("th_massnahme_name"), t("th_massnahme_scope"), t("th_massnahme_wirkung"), t("th_massnahme_jahr")]]
    .concat(state.massnahmen.map(m=>[m.name, measureScopeLabel(m.scope), Number(m.wirkung)||0, Number(m.jahr)||0]));

  const kpis = [
    [t("th_kennzahl"), t("th_wert")],
    [t("kpi_bau")+" (t)", Math.round(r.totalBau)],
    [t("kpi_zielreduktion")+" (t)", Math.round(r.totalZiel)],
    [t("kpi_massnahmen")+" (t)", Math.round(r.totalMassnahmen)],
    [t("kpi_deckungsgrad")+" (%)", covCell(r.overallCov)],
    [t("kpi_nettogesamt")+" (t)", Math.round(r.nettoGesamt)]
  ].concat(r.rows.map(row=>[t(row.scope)+" — "+t("th_deckungsgrad")+" (%)", covCell(row.cov)]));

  const audit = [[t("th_frage"), t("th_antwort")]]
    .concat((state.auditAnswers||[]).map((a,idx)=>[t("aq_"+(idx+1)), a||""]));

  return xlsWorkbook([
    xlsSheet(t("xls_projekt"), projekt),
    xlsSheet(t("xls_scopes"), scopes),
    xlsSheet(t("xls_s3"), s3),
    xlsSheet(t("h_massnahmen"), massnahmen),
    xlsSheet(t("xls_kennzahlen"), kpis),
    xlsSheet(t("xls_audit"), audit)
  ]);
}
function downloadExcel(){
  /* Kein normaler Ergebnisexport aus ungueltigen Zahlen (Audit NZ-006/NZ-010). */
  const r = buildDashboardResult();
  if(!r.valid){ alert(t("err_export_blocked")+"\n\n"+r.errors.map(e=>"- "+e.msg).join("\n")); return; }
  downloadFile((state.project.name||"netzero")+"_export.xls", buildExcelExport(), "application/vnd.ms-excel");
}

/* ============================= CSV-IMPORT (Maßnahmen) =============================
   Spalten: Name; Scope (scope1/scope2/scope3 oder s3-01…s3-15 oder "Scope 1"/"S3.4"); Wirkung t/a; Jahr */
function parseDeNumber(s){
  s = String(s??"").trim().replace(/\s/g,"").replace(/€|t\b/g,"");
  if(!s) return 0;
  if(/,\d+$/.test(s)) s = s.replace(/\./g,"").replace(",",".");
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,"");
  const n = Number(s);
  return isFinite(n)? n : 0;
}
/* Liefert null statt "scope1", wenn der Token nicht erkannt wird. Ein stiller Rückfall auf Scope 1
   verschöbe die Maßnahme in den falschen Scope und verfälschte den Deckungsgrad, ohne dass es auffällt. */
function parseScopeToken(s){
  const v = String(s??"").trim().toLowerCase();
  if(/^s3[-.\s]?(\d{1,2})\b/.test(v)){ const no = Math.min(15, Math.max(1, parseInt(v.match(/^s3[-.\s]?(\d{1,2})/)[1],10))); return "s3-"+String(no).padStart(2,"0"); }
  if(/^(scope\s*1|s1|1)$/.test(v)) return "scope1";
  if(/^(scope\s*2|s2|2)$/.test(v)) return "scope2";
  if(/^(scope\s*3|s3|3)$/.test(v)) return "scope3";
  if(/scope\s*1/.test(v)) return "scope1";
  if(/scope\s*2/.test(v)) return "scope2";
  if(/scope\s*3/.test(v)) return "scope3";
  return null;
}

/* CSV-Zeile mit Rücksicht auf gequotete Felder zerlegen: "Kessel; alter Typ";scope1;100 ist EIN Name.
   Doppelte Anführungszeichen innerhalb eines Felds ("") stehen für ein literales Zeichen (RFC 4180). */
function splitCsvLine(line, delim){
  const cols=[]; let cur="", inQ=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(inQ){
      if(ch==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else inQ=false; }
      else cur+=ch;
    } else if(ch==='"') inQ=true;
    else if(ch===delim){ cols.push(cur); cur=""; }
    else cur+=ch;
  }
  cols.push(cur);
  return cols.map(c=>c.trim());
}

/* Gibt Zähler zurück statt nur die Importzahl: übersprungene Zeilen werden dem Nutzer gemeldet,
   damit eine vertippte Scope-Spalte nicht unbemerkt Maßnahmen verschluckt oder verschiebt. */
function importMassnahmenCsv(text){
  text = text.replace(/^﻿/, ""); // BOM aus Excel-Exporten
  const first = text.split(/\r?\n/)[0] || "";
  const delim = (first.split(";").length >= first.split(",").length) ? ";" : ",";
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  let imported = 0, skippedScope = 0, skippedRow = 0;

  lines.forEach((line, idx)=>{
    const cols = splitCsvLine(line, delim);
    if(cols.length < 3){ skippedRow++; return; }
    // Kopfzeile: erste Zeile, deren Wirkungsspalte keine Zahl enthält
    if(idx===0 && !/^-?[\d.,\s]+$/.test(cols[2]||"")) return;
    if(!String(cols[2]??"").trim()){ skippedRow++; return; }

    const scope = parseScopeToken(cols[1]);
    if(!scope){ skippedScope++; return; }

    state.massnahmen.push({
      id: state.nextMassnahmeId++,
      name: cols[0]||("Import "+(imported+1)),
      scope,
      wirkung: parseDeNumber(cols[2]),
      jahr: Math.round(parseDeNumber(cols[3])) || state.project.zieljahr
    });
    imported++;
  });
  return {imported, skippedScope, skippedRow};
}

/* ============================= INIT ============================= */
function renderAll(){ renderHeader(); renderMain(); updateStickyKpis(); renderWarnings(); }

(function init(){
  // Ladepriorität: geteilter Link (Hash) > Autosave (localStorage) > Standardwerte
  let loaded = false;
  if(location.hash && location.hash.length>1){
    try{
      const decoded = JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(1)))));
      state = migrateState(decoded);
      loaded = true;
    }catch(e){ /* ignore malformed hash */ }
  }
  if(!loaded){
    try{
      const raw = localStorage.getItem(AUTOSAVE_KEY);
      if(raw) state = migrateState(JSON.parse(raw));
    }catch(e){ /* corrupted autosave — start fresh */ }
  }

  // Globaler Listener (Bubbling nach den Feld-Listenern): Autosave, KPI-Leiste, Warnungen
  ["input","change"].forEach(evt=> document.addEventListener(evt, ()=>{
    scheduleAutosave();
    updateStickyKpis();
    renderWarnings();
  }));

  // JSON-Import: migrateState() als defensiver Deep-Merge
  document.getElementById("fileLoad").addEventListener("change",(e)=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        state = migrateState(JSON.parse(reader.result));
        renderAll();
        scheduleAutosave();
        alert(t("importedMsg"));
      }catch(err){ alert(t("importErr")); }
      e.target.value = "";
    };
    reader.readAsText(file);
  });

  // Maßnahmen-CSV-Import (lokal, z. B. aus in Excel gepflegten Listen)
  document.getElementById("csvLoad").addEventListener("change",(e)=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const r = importMassnahmenCsv(String(reader.result));
        const hinweise = [];
        if(r.skippedScope) hinweise.push(t("masscsv_skipped_scope").replace("{n}", r.skippedScope));
        if(r.skippedRow) hinweise.push(t("masscsv_skipped_row").replace("{n}", r.skippedRow));
        if(r.imported>0){
          renderAll(); scheduleAutosave();
          alert([t("masscsv_imported").replace("{n}", r.imported)].concat(hinweise).join("\n"));
        } else {
          alert([t("masscsv_none")].concat(hinweise).join("\n"));
        }
      }catch(err){ alert(t("importErr")); }
      e.target.value = "";
    };
    reader.readAsText(file);
  });

  renderAll();
if(typeof initSpotlightV2==="function")initSpotlightV2();
  setSaveBadge("saved");
})();
</script>
